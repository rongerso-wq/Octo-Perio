<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"/>
  <meta name="referrer" content="no-referrer"/>
  <title>OctoPerio — כלי תמיכה קלינית פריו-אימפלנט | רמב"ם</title>
  <link href="vendor/fonts/google-fonts.css" rel="stylesheet"/>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            perio: {
              bg: '#060D14', surface: '#0C1A28', panel: '#0F2035',
              border: '#1A3050', accent: '#2DD4BF', accentDim: '#1A8A7B',
              text: '#E2E8F0', textDim: '#94A3B8', muted: '#64748B',
            }
          },
          fontFamily: {
            heb: ['Heebo','Arial','sans-serif'],
            en:  ['Inter','system-ui','sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-family:'Heebo',Arial,sans-serif;}
    body{background:#060D14;color:#E2E8F0;min-height:100vh;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:#0C1A28;}
    ::-webkit-scrollbar-thumb{background:#1A3050;border-radius:4px;}

    .field-input{
      background:#0C1A28;border:1px solid #1A3050;border-radius:8px;
      color:#E2E8F0;font-family:'Heebo',Arial,sans-serif;
      font-size:.875rem;padding:8px 12px;width:100%;transition:border-color .15s;
    }
    .field-input:focus{outline:none;border-color:#2DD4BF;box-shadow:0 0 0 3px rgba(45,212,191,.12);}
    select.field-input option{background:#0C1A28;}
    input[type="number"].field-input,input[type="date"].field-input{direction:ltr;text-align:left;font-family:'Inter',sans-serif;}

    .card{background:#0C1A28;border:1px solid #1A3050;border-radius:16px;padding:20px;}
    .card-title{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#2DD4BF;margin-bottom:14px;}

    .tab-btn{padding:12px 22px;min-height:44px;font-weight:700;font-size:.82rem;border-bottom:2px solid transparent;
      color:#64748B;cursor:pointer;transition:all .15s;white-space:nowrap;
      background:none;border-top:none;border-left:none;border-right:none;font-family:'Heebo',Arial,sans-serif;}
    .tab-btn:hover{color:#94A3B8;}
    .tab-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #2DD4BF;border-radius:6px;}
    .tab-active{border-bottom-color:#2DD4BF!important;color:#2DD4BF!important;}

    button:focus-visible{outline:2px solid #2DD4BF;outline-offset:2px;}

    .reasoning-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #0F2035;}
    .reasoning-row:last-child{border-bottom:none;}

    .clinical-num{direction:ltr;font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;}

    .author-signature{
      position:fixed;bottom:14px;
      inset-inline-end:18px;
      z-index:50;pointer-events:none;
      font-family:'Caveat','Heebo',cursive;
      font-weight:600;font-size:1.05rem;
      direction:ltr;
      color:#5EEAD4;opacity:.42;
      letter-spacing:.01em;
      text-shadow:0 1px 8px rgba(45,212,191,.18);
      transition:opacity .25s ease;
      user-select:none;-webkit-user-select:none;
      white-space:nowrap;
      display:flex;align-items:baseline;gap:6px;
    }
    .author-signature:hover{opacity:.88;}
    .author-signature .sig-prefix{
      font-family:'Inter',sans-serif;font-weight:400;
      font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
      color:#64748B;
    }
    .author-signature .sig-name{
      font-size:1.25rem;line-height:1;
      background:linear-gradient(95deg,#5EEAD4 0%,#2DD4BF 60%,#1A8A7B 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    /* Move watermark to bottom-START so it never collides with bottom-END action buttons (Print, etc.) */
    .author-signature{bottom:14px;inset-inline-start:18px;inset-inline-end:auto;}
    @media (max-width:520px){
      .author-signature{bottom:8px;inset-inline-start:10px;}
      .author-signature .sig-prefix{display:none;}
      .author-signature .sig-name{font-size:1.05rem;}
    }
    /* Hide the watermark when on the Output tab (the letter is the artefact) */
    body.tab-output .author-signature{display:none;}

    @media (prefers-reduced-motion: reduce){
      .fade-in, *{animation:none!important;transition:none!important;}
    }

    .fade-in{animation:fadeIn .22s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}

    textarea.field-input{resize:vertical;min-height:340px;line-height:1.75;font-size:.82rem;}

    /* ─── Periodontal chart ─── */
    .perio-chart{display:flex;flex-direction:column;gap:18px;direction:ltr;width:max-content;margin:0 auto;}
    .arch-row{display:flex;gap:3px;justify-content:center;}
    .arch-divider{height:1px;background:#1A3050;margin:4px 0;}
    .tooth-col{display:flex;flex-direction:column;gap:2px;align-items:center;width:68px;}
    .tooth-col.missing .tooth-crown{opacity:.3;border-style:dashed;}
    .tooth-crown{width:66px;padding:3px 4px;background:#0F2035;border:1px solid #1A3050;border-radius:5px;
      display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;}
    .tooth-num{font-weight:700;color:#94A3B8;font-family:'Inter',sans-serif;letter-spacing:.02em;}
    .tooth-flags{display:flex;gap:4px;font-size:.55rem;font-family:'Inter',sans-serif;height:11px;align-items:center;}
    .tooth-actions{display:flex;gap:1px;}
    .tooth-actions button{background:transparent;color:#475569;border:1px solid transparent;
      cursor:pointer;padding:1px 4px;font-size:.6rem;font-family:'Inter',sans-serif;border-radius:3px;line-height:1;}
    .tooth-actions button:hover{color:#5EEAD4;border-color:#1A3050;background:#0C1A28;}
    .tooth-actions button.active{color:#5EEAD4;background:#0C1A28;border-color:#2DD4BF44;}
    .site-row{display:flex;gap:1px;}
    .site-cell{display:flex;flex-direction:column;width:22px;border:1px solid #1A3050;border-radius:3px;
      background:#0C1A28;overflow:hidden;}
    .site-cell.pd-mid{background:#2D1B0033;}
    .site-cell.pd-high{background:#2D0D0D44;}
    .site-cell input{width:100%;height:18px;text-align:center;background:transparent;color:#E2E8F0;
      border:none;border-bottom:1px solid #1A3050;font-size:.7rem;font-weight:600;font-family:'Inter',sans-serif;
      padding:0;outline:none;}
    .site-cell input::-webkit-inner-spin-button,
    .site-cell input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .site-cell input.gm{font-weight:400;color:#94A3B8;}
    .site-cell input.pd-mid{color:#FCD34D;}
    .site-cell input.pd-high{color:#FCA5A5;}
    .site-cell input:focus{background:#1A3050;color:#5EEAD4!important;}
    .site-dots{display:flex;gap:2px;justify-content:center;padding:2px 0;background:#0F2035;}
    .site-dot{width:6px;height:6px;border-radius:50%;cursor:pointer;background:#1A3050;
      transition:background .15s, transform .1s;}
    .site-dot:hover{transform:scale(1.3);}
    .site-dot.bop{background:#EF4444;}
    .site-dot.sup{background:#FCD34D;}
    .site-dot.plaque{background:#94A3B8;}
    .chart-pill{display:inline-flex;align-items:center;gap:6px;background:#0F2035;border:1px solid #1A3050;
      border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:.78rem;}
    .chart-pill .label{color:#94A3B8;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;}
    .chart-pill .val{color:#5EEAD4;font-weight:700;font-variant-numeric:tabular-nums;}

    /* Phase 3 — strip layout, SVG overlay, markers, toast */
    .arch-band{display:flex;flex-direction:column;align-items:center;}
    .arch-strip{display:flex;justify-content:center;width:100%;}
    .arch-strip-content{display:flex;gap:3px;position:relative;}
    .tooth-sites{display:flex;gap:1px;width:68px;flex:0 0 68px;align-items:flex-start;}
    .tooth-sites.missing{height:47px;background:repeating-linear-gradient(45deg,#0F203522 0,#0F203522 4px,transparent 4px,transparent 8px);
      border:1px dashed #1A3050;border-radius:4px;opacity:.4;}
    .tooth-sites-spacer{width:68px;flex:0 0 68px;height:47px;}
    .site-cell{position:relative;z-index:1;}
    .row-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
    .row-overlay .pd-line{fill:none;stroke:#3B82F6;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.85;}
    .row-overlay .gm-line{fill:none;stroke:#EF4444;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.85;
      stroke-dasharray:3 2;}
    .row-overlay .pd-dot{fill:#3B82F6;}
    .row-overlay .gm-dot{fill:#EF4444;}
    .tooth-crown-strip{width:68px;flex:0 0 68px;}
    .mobility-marker{display:flex;gap:3px;justify-content:center;height:6px;align-items:center;margin-bottom:1px;}
    .mobility-marker .dot{width:4px;height:4px;border-radius:50%;background:#1A3050;}
    .mobility-marker .dot.on{background:#FCD34D;box-shadow:0 0 3px #FCD34D88;}
    .furc-glyph{width:10px;height:10px;display:inline-block;vertical-align:middle;}
    .furc-glyph polygon{stroke:#FCA5A5;stroke-width:1;}
    .furc-glyph.f1 polygon{fill:none;}
    .furc-glyph.f2 polygon{fill:url(#furc-half);}
    .furc-glyph.f3 polygon{fill:#FCA5A5;}
    .last-action-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
      background:#0F2035;border:1px solid #2DD4BF;color:#5EEAD4;
      padding:8px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-size:.8rem;
      box-shadow:0 4px 14px rgba(45,212,191,.18);z-index:200;pointer-events:none;
      animation:toastFade 1.5s ease-out forwards;}
    @keyframes toastFade{
      0%{opacity:0;transform:translate(-50%,8px);}
      15%,75%{opacity:1;transform:translate(-50%,0);}
      100%{opacity:0;transform:translate(-50%,-4px);}
    }
    @media (prefers-reduced-motion:reduce){
      .last-action-toast{animation:none;opacity:1;}
    }
    .site-cell.cell-focused{outline:2px solid #2DD4BF;outline-offset:0;}

    /* Phase 4 — view toggle pills + responsive defaults + landscape print */
    .chart-view-toggle{display:flex;gap:4px;flex-wrap:wrap;align-items:center;
      margin-bottom:10px;padding:6px 8px;background:#0F2035;border:1px solid #1A3050;
      border-radius:8px;}
    .chart-view-toggle .label{font-size:.62rem;letter-spacing:.08em;color:#94A3B8;
      text-transform:uppercase;font-weight:700;font-family:'Inter',sans-serif;
      padding:0 6px;}
    .chart-view-toggle button{background:transparent;color:#94A3B8;
      border:1px solid #1A3050;border-radius:6px;padding:4px 10px;
      font-size:.72rem;cursor:pointer;font-family:'Inter',sans-serif;
      letter-spacing:.04em;transition:color .12s,background .12s,border-color .12s;}
    .chart-view-toggle button:hover{color:#5EEAD4;border-color:#1A3050;}
    .chart-view-toggle button.active{background:#0C1A28;color:#5EEAD4;
      border-color:#2DD4BF66;font-weight:700;}
    .chart-view-toggle .sep{width:1px;height:18px;background:#1A3050;margin:0 4px;}

    @page chart-landscape{ size:A4 landscape; margin:1cm; }
    @media print{
      body.tab-chart .chart-view-toggle,
      body.tab-chart .last-action-toast{ display:none!important; }
      body.tab-chart .perio-chart{ page:chart-landscape; min-width:0; }
      body.tab-chart .perio-chart-wrap{ overflow:visible!important; background:#fff!important;
        border:none!important; }
      body.tab-chart{ background:#fff!important; color:#000!important; }
      body.tab-chart .row-overlay .pd-line{ stroke:#1E40AF; opacity:1; }
      body.tab-chart .row-overlay .gm-line{ stroke:#991B1B; opacity:1; }
    }

    .print-only{display:none;}

    @media (max-width:900px){
      .idra-grid{grid-template-columns:1fr!important;}
    }

    /* Tab-bar — fade-edge so users notice horizontal overflow on phones */
    .tab-bar-wrap{position:relative;}
    .tab-bar-wrap::after{
      content:'';position:absolute;top:0;bottom:0;
      inset-inline-end:0;width:24px;pointer-events:none;
      background:linear-gradient(to left,#060D14,transparent);
    }
    [dir="rtl"] .tab-bar-wrap::after{background:linear-gradient(to right,#060D14,transparent);}

    /* Records grid: collapse to 1-col below tablet so Hebrew labels don't choke at 150px */
    @media (max-width:780px){
      .records-grid{grid-template-columns:1fr!important;}
    }

    /* ───── Mobile / smartphone layout (≤640px) ───── */
    @media (max-width:640px){
      .card{padding:14px!important;border-radius:12px!important;}
      .card-title{font-size:.62rem;margin-bottom:10px;}
      .field-input{font-size:.92rem;padding:9px 11px;}
      .tab-btn{padding:11px 14px!important;font-size:.78rem!important;}
      textarea.field-input{min-height:240px;font-size:.86rem;line-height:1.65;}
      .reasoning-row{padding:8px 0;}
      .nav-subtitle{display:none!important;}
      .nav-rambam{font-size:.6rem!important;padding:2px 8px!important;}
      .records-grid{grid-template-columns:1fr!important;}
      /* Stage / Grade / Status badges shrink on phones */
      .badge-sg{font-size:1.55rem!important;padding:10px 18px!important;min-width:78px!important;}
      .badge-ext, .badge-status{padding:10px 14px!important;min-width:80px!important;}
      .badge-ext > div:last-child, .badge-status > div:last-child{font-size:.86rem!important;}
      .diag-line{font-size:.84rem!important;padding:11px 13px!important;line-height:1.55;}
      .diag-line span{display:block;margin:4px 0 0!important;}
      .tab-content{padding:14px 12px!important;}
      .navbar-root{padding:0 12px!important;gap:8px!important;}
      /* References cards: button below text on phones */
      .refs-card{flex-direction:column;align-items:stretch!important;}
      .refs-card a{align-self:flex-start;}
    }
    @media (max-width:380px){
      .badge-sg{font-size:1.3rem!important;padding:8px 13px!important;min-width:62px!important;}
      .tab-btn{padding:10px 11px!important;font-size:.74rem!important;}
    }

    @media print{
      *,*::before,*::after{
        background:transparent!important;color:#000!important;
        box-shadow:none!important;text-shadow:none!important;
        -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
      }
      .no-print,textarea.field-input{display:none!important;}
      .print-only{display:block!important;}
      html,body{background:#fff!important;}
      .card{background:#fff!important;border:1px solid #cbd5e1!important;page-break-inside:avoid;border-radius:6px!important;padding:14px!important;margin-bottom:10px!important;}
      .card-title{color:#334155!important;border-bottom:1px solid #cbd5e1;padding-bottom:4px;margin-bottom:8px;font-size:9pt!important;}
      .reasoning-row{border-bottom:1px solid #e2e8f0!important;}
      .print-letter{
        font-family:'Heebo',Arial,sans-serif;
        font-size:11pt;line-height:1.65;
        white-space:pre-wrap;word-break:break-word;
        padding:0;margin:0;color:#000;
      }
      .print-header{
        border-bottom:2px solid #1A3050;padding-bottom:6mm;margin-bottom:8mm;
        font-family:'Heebo',Arial,sans-serif;
      }
      .print-header h1{font-size:16pt;font-weight:800;margin:0 0 2mm;}
      .print-header .meta{font-size:10pt;color:#475569!important;}
      .field-input{border:1px solid #cbd5e1!important;background:#fff!important;color:#000!important;}
      @page{margin:18mm;size:A4;}
    }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">

/* ─── CORE ALGORITHMS ────────────────────────────────────────────────────── */
function toRoman(n){ return ['','I','II','III','IV'][n]||'?'; }

function computeDiagnosis({ calWorst,rblPercent,maxPD,vbl,furcation,mobility,
    teethLost,teethAffected,mastDys,smokingCigs,hba1c,age }){
  const cal = parseFloat(calWorst), rbl = parseFloat(rblPercent);
  if(isNaN(cal)||isNaN(rbl)) return null;
  const pd = parseFloat(maxPD), vblV = parseFloat(vbl);
  const steps = [];

  // Stage from CAL
  let stageCAL = cal<2?1:cal<=4?2:3;
  steps.push({ key:'rCAL', val:`${cal}mm → Stage ${toRoman(stageCAL)}` });

  // Stage from RBL
  let stageRBL = rbl<15?1:rbl<=33?2:3;
  steps.push({ key:'rRBL', val:`${rbl}% → Stage ${toRoman(stageRBL)}` });

  // Base
  let stage = Math.max(stageCAL,stageRBL);
  steps.push({ key:'rBase', val:`Stage ${toRoman(stage)}` });

  // Complexity upgrades
  const cx=[];
  if(!isNaN(pd)&&pd>=6&&stage<3){ stage=3; cx.push(`PD ${pd}mm ≥6mm → III`); }
  if(!isNaN(vblV)&&vblV>=3&&stage<3){ stage=3; cx.push(`VBL ${vblV}mm ≥3mm → III`); }
  if(furcation==='2'&&stage<3){ stage=3; cx.push('Furcation II → III'); }
  if(furcation==='3'&&stage<4){ stage=4; cx.push('Furcation III → IV'); }
  if(parseInt(mobility)>=2&&stage<4){ stage=4; cx.push(`Mobility ${mobility} → IV`); }
  if(mastDys&&stage<4){ stage=4; cx.push('Masticatory dysfunction → IV'); }
  const tl=parseInt(teethLost)||0;
  if(tl>=5&&stage<4){ stage=4; cx.push(`${tl} teeth lost → IV`); }
  else if(tl>=1&&tl<=4&&stage<3){ stage=3; cx.push(`${tl} teeth lost → III`); }
  if(cx.length) steps.push({ key:'rComplex', val:cx.join(' | ') });
  steps.push({ key:'rFinalStage', val:`Stage ${toRoman(stage)}`, hl:true });

  // Grade
  let grade='B', gradeScore=null;
  if(age&&age>0){
    gradeScore=rbl/age;
    grade=gradeScore<0.25?'A':gradeScore<=1.0?'B':'C';
    steps.push({ key:'rGScore', val:`${rbl}/${age} = ${gradeScore.toFixed(3)} → Grade ${grade}` });
  } else {
    steps.push({ key:'rGScore', val:'Age unknown — Grade B (default)' });
  }

  const mods=[];
  const cigs=parseInt(smokingCigs)||0;
  const hval=parseFloat(hba1c);
  if(cigs>=10&&grade!=='C'){ grade='C'; mods.push(`Smoking ${cigs} cig/day ≥10 → C`); }
  if(!isNaN(hval)&&hval>=7.0&&grade!=='C'){ grade='C'; mods.push(`HbA1c ${hval}% ≥7.0% → C`); }
  if(mods.length) steps.push({ key:'rGMod', val:mods.join(' | ') });
  steps.push({ key:'rFinalGrade', val:`Grade ${grade}`, hl:true });

  const pct=parseFloat(teethAffected);
  const extent=isNaN(pct)?'undef':pct<30?'localized':'generalized';
  steps.push({ key:'rExtent', val:extent });

  return { stage:toRoman(stage), stageN:stage, grade, extent, gradeScore, steps };
}

function computeIDRARisk(scores){
  const any3=scores.some(s=>s===3), c2=scores.filter(s=>s===2).length;
  if(!any3&&scores.every(s=>s===1)) return 'LOW';
  if(any3||c2>=3) return 'HIGH';
  return 'MODERATE';
}

function blankSite(){ return {pd:null, gm:null, bop:false, sup:false, plaque:false}; }
function blankTooth(){
  return {missing:false, implant:false, mobility:0, furcation:0,
    sites:{mb:blankSite(),b:blankSite(),db:blankSite(),ml:blankSite(),l:blankSite(),dl:blankSite()}};

function createBlankChart(){
  const c={};
  for(const fdi of [...FDI_MAXILLA, ...FDI_MANDIBLE]) c[fdi]=blankTooth();

}

    {pd:5,gm:1,bop:true,sup:false,plaque:false},
    {pd:7,gm:1,bop:true,sup:true, plaque:true},
    {pd:4,gm:0,bop:true,sup:false,plaque:true},
    {pd:5,gm:1,bop:false,sup:false,plaque:false},
    {pd:6,gm:0,bop:true,sup:false,plaque:true},
  ];
  const ant=[
    {pd:4,gm:0,bop:true,sup:false,plaque:false},
    {pd:3,gm:0,bop:false,sup:false,plaque:true},
    {pd:5,gm:1,bop:true,sup:false,plaque:true},
    {pd:3,gm:0,bop:true,sup:false,plaque:false},
    {pd:4,gm:0,bop:false,sup:false,plaque:true},
    {pd:4,gm:1,bop:true,sup:false,plaque:false},
  ];
  const isPosterior = (fdi) => ['7','6','5','4'].includes(fdi[1]);
  for(const fdi of [...FDI_MAXILLA,...FDI_MANDIBLE]){
    if(c[fdi].missing) continue;
    const tmpl = isPosterior(fdi) ? post : ant;
    for(let i=0;i<SITE_KEYS.length;i++) c[fdi].sites[SITE_KEYS[i]]={...tmpl[i]};
  }
  /* Worst-site outliers — drives maxPD=8, worstCAL=7 */
  c['17'].sites.mb={pd:8,gm:1,bop:true,sup:true,plaque:true};
  c['27'].sites.db={pd:7,gm:0,bop:true,sup:true,plaque:false};
  return c;
}
/* Aggregate the chart into the summary stats the staging engine + IDRA need.
   - calWorst:     max(pd + gm) across measured sites; CAL is derived per-site (never stored)
   - maxPD:        max pd across measured sites
   - bopPercent:   100 × bop_sites / measured_sites  (alias: fmbs)
   - fmps:         100 × plaque_sites / measured_sites
   - teethAffected:100 × (teeth with any CAL ≥1mm site) / present_teeth
   - pdSitesScore: IDRA vector — 1 if 0 sites ≥5mm, 2 if 1–4, 3 if ≥5
   - presentTeeth: count of non-missing teeth (used to decide if chart is "filled enough") */
function computeChartDerived(chart){
  let measured=0, bopCount=0, plaqueCount=0, sites5plus=0;
  let maxPD=0, worstCAL=0, furcMax=0, mobMax=0;
  let presentTeeth=0, affectedTeeth=0;
  for(const fdi of Object.keys(chart)){
    const tooth=chart[fdi];
    if(tooth.missing) continue;
    presentTeeth++;
    if(tooth.furcation>furcMax) furcMax=tooth.furcation;
    if(tooth.mobility>mobMax)   mobMax=tooth.mobility;
    let toothAffected=false;
    for(const k of SITE_KEYS){
      const s=tooth.sites[k];
      if(s.pd!=null){
        measured++;
        if(s.pd>maxPD) maxPD=s.pd;
        if(s.pd>=5)    sites5plus++;
        const cal=(s.pd??0)+(s.gm??0);
        if(cal>worstCAL) worstCAL=cal;
        if(cal>=1) toothAffected=true;
      }
      if(s.bop)    bopCount++;
      if(s.plaque) plaqueCount++;
    }
    if(toothAffected) affectedTeeth++;
  }
  const pct=(n)=>measured?Math.round((n/measured)*100):0;
  return {
    measured, presentTeeth,
    fmbs:pct(bopCount), fmps:pct(plaqueCount),
    bopPercent:pct(bopCount),
    maxPD, calWorst:worstCAL,
    teethAffected:presentTeeth?Math.round((affectedTeeth/presentTeeth)*100):0,
    furcationMax:furcMax, mobilityMax:mobMax,
    pdSitesScore: sites5plus===0?1:sites5plus<=4?2:3,
    sites5plus,
  };
}

/* Peri-Implant case definitions (Berglundh et al. 2018, J Clin Periodontol — PMID 29926948).
   Health: no BOP/SUP, no progressive bone loss.
   Mucositis: BOP/SUP present, no bone loss beyond physiologic remodeling.
   Peri-implantitis: BOP/SUP + radiographic BL ≥3 mm (no baseline) OR ≥2 mm vs baseline 1-yr post-loading film. */
function computePeriImplantDx({hasImplants, bopSup, bl, hasBaseline}){
  if(!hasImplants) return null;
  if(!bopSup) return 'health';
  const blN = parseFloat(bl);
  if(isNaN(blN) || blN <= 0) return 'mucositis';
  const thresh = hasBaseline ? 2 : 3;
  return blN >= thresh ? 'periimplantitis' : 'mucositis';
}

/* SPT interval titrated to IDRA risk (Heitz-Mayfield et al. 2020, Periodontol 2000 — PMID 32780477). */
function sptIntervalKey(risk){
  return risk==='HIGH' ? 'sptHigh' : risk==='LOW' ? 'sptLow' : 'sptMod';
}

/* Israeli National ID — 9 digits, mod-10 checksum (Luhn-like, alternating ×1/×2, sum digits if >9). */
function validIsraeliID(id){
  if(!/^\d{9}$/.test(id||'')) return false;
  let sum=0;
  for(let i=0;i<9;i++){
    let d=parseInt(id[i],10)*((i%2===0)?1:2);
    if(d>9) d=Math.floor(d/10)+(d%10);
    sum+=d;
  }
  return sum%10===0;
}

/* Auto case-type triage (Tonetti/Greenwell/Kornman 2018, J Periodontol — PMID 29926952).
   Periodontitis case definition: interdental CAL ≥1 mm at ≥2 non-adjacent teeth. */
function autoCaseType({calWorst, bopPercent}){
  const cal=parseFloat(calWorst), bop=parseFloat(bopPercent);
  if((isNaN(cal)||cal===0) && (isNaN(bop)||bop<10)) return 'health';
  if((isNaN(cal)||cal===0) && bop>=10) return 'gingivitis';
  return 'periodontitis';
}

/* Treatment-status auto-detect (Chapple 2018, J Periodontol — PMID 29926944).
   Stable: BOP <10%, max PD ≤4 mm, no BOP at 4-mm sites, no sites ≥5 mm.
   Remission: BOP <10%, residual PD ≥5 mm but no BOP.
   Unstable: PD ≥6 mm, OR PD ≥5 mm with BOP. */
function autoTxStatus({maxPD, bopPercent}){
  const pd=parseFloat(maxPD), bop=parseFloat(bopPercent);
  if(isNaN(pd)||isNaN(bop)) return 'untreated';
  if(pd>=6) return 'unstable';
  if(pd>=5 && bop>=10) return 'unstable';
  if(pd>=5 && bop<10) return 'remission';
  if(pd<=4 && bop<10) return 'stable';
  return 'untreated';
}

/* ICD-10 mapping for AAP/EFP 2018 case types & stages. */
function icd10For({caseType, stage}){
  if(caseType==='health') return 'Z01.20';
  if(caseType==='gingivitis') return 'K05.10';
  if(caseType==='npd') return 'A69.1';
  if(caseType==='endoPerio') return 'K04.7';
  if(caseType==='periodontitis'){
    if(stage==='I') return 'K05.31';
    if(stage==='II') return 'K05.32';
    if(stage==='III'||stage==='IV') return 'K05.33';
    return 'K05.30';
  }
  return 'K05.6';
}

/* EFP S3 Stepwise Treatment (Sanz, Herrera et al. 2020, J Clin Periodontol — DOI 10.1111/jcpe.13290; PMID 32383274).
   Stage IV: Herrera, Sanz, Kebschull et al. 2022 — DOI 10.1111/jcpe.13639. */
function s3Steps({lang, stage, grade, extent, sptHe, sptEn}){
  const he = lang==='he';
  const adjAB = (grade==='C' && extent==='generalized');
  const lines = [];
  lines.push(he?'• שלב 1 — שינוי התנהגותי, OHI, הסרת רובד על-חניכי, הנחיית חדילה מעישון':
                 '• Step 1 — Behavioural change, OHI, supragingival biofilm/calculus removal, smoking-cessation counselling');
  lines.push(he?'• שלב 2 — אינסטרומנטציה תת-חניכית (SRP); הערכה מחדש לאחר 8–12 שבועות':
                 '• Step 2 — Subgingival instrumentation (SRP); re-evaluation at 8–12 weeks');
  if(adjAB) lines.push(he?'   ↳ שיקול תוספת אנטיביוטיקה סיסטמית (Stage III גנרליזד, Grade C, מטופל צעיר)':
                            '   ↳ Consider adjunctive systemic antibiotics (Stage III generalized, Grade C, young patient)');
  if(stage==='III'||stage==='IV') lines.push(he?'• שלב 3 — ניתוח פריודונטלי לכיסים שיוריים ≥6 מ"מ (resective/regenerative)':
                                                  '• Step 3 — Periodontal surgery for residual pockets ≥6 mm (resective/regenerative)');
  if(stage==='IV') lines.push(he?'• ניהול רב-תחומי — אורתודונטיה, פרוסטודונטיה, סד-לעיסה לפי הצורך (CPG Stage IV — Herrera 2022)':
                                  '• Multidisciplinary management — orthodontic, prosthodontic, occlusal splint as indicated (Stage IV CPG, Herrera 2022)');
  lines.push(he?`• שלב 4 — תחזוקה (SPT) ${sptHe} מבוסס IDRA`:
                 `• Step 4 — Supportive Periodontal Therapy (SPT) ${sptEn} (IDRA-based)`);
  return lines.join('\n');
}

/* ─── OCTAGON SVG HELPERS ────────────────────────────────────────────────── */
const CX=230, CY=230;
const ZONE_R={1:62,2:114,3:166}, LABEL_R=200;

function axPt(i,r){
  const a=(i*45-90)*Math.PI/180;
  return {x:CX+r*Math.cos(a), y:CY+r*Math.sin(a)};
}
function pts(radii){ return radii.map((r,i)=>{ const p=axPt(i,r); return `${p.x},${p.y}`; }).join(' '); }
function zonePts(r){ return pts(AXES.map(()=>r)); }
function dataPts(scores){ return pts(scores.map(s=>ZONE_R[s]||ZONE_R[1])); }

function FSelect({ label,note,value,onChange,opts }){

/* ─── BADGE COMPONENTS ────────────────────────────────────────────────────── */
const STAGE_C={I:{bg:'#1E1B4B',c:'#A5B4FC'},II:{bg:'#082038',c:'#7DD3FC'},III:{bg:'#2D1B00',c:'#FCD34D'},IV:{bg:'#2D0D0D',c:'#FCA5A5'}};
const GRADE_C={A:{bg:'#052E16',c:'#4ADE80'},B:{bg:'#2D1B00',c:'#FCD34D'},C:{bg:'#2D0D0D',c:'#FCA5A5'}};
const RISK_C={LOW:{bg:'#052E16',c:'#4ADE80'},MODERATE:{bg:'#2D1B00',c:'#FCD34D'},HIGH:{bg:'#2D0D0D',c:'#FCA5A5'}};

function StageBadge({stage}){

  return (
    <div className="badge-sg" style={{background:s.bg,color:s.c,fontFamily:'Inter,sans-serif',fontWeight:800,fontSize:'2.4rem',
      borderRadius:16,padding:'14px 32px',textAlign:'center',border:`1px solid ${s.c}33`,direction:'ltr',minWidth:110}}>

      {stage}

}
function GradeBadge({grade}){
  const g=GRADE_C[grade]||{bg:'#0C1A28',c:'#E2E8F0'};
  return (
    <div className="badge-sg" style={{background:g.bg,color:g.c,fontFamily:'Inter,sans-serif',fontWeight:800,fontSize:'2.4rem',
      borderRadius:16,padding:'14px 32px',textAlign:'center',border:`1px solid ${g.c}33`,direction:'ltr',minWidth:110}}>

function RiskBadge({risk,label}){

/* ─── OCTAGON SVG ─────────────────────────────────────────────────────────── */
function OctagonSVG({scores}){
  const V=460;
  return (
    <svg viewBox={`0 0 ${V} ${V}`} style={{width:'100%',maxWidth:520,display:'block'}}>
      <rect width={V} height={V} fill="#0C1A28" rx="12"/>
      {/* Zone fills */}
      <polygon points={zonePts(ZONE_R[3])} fill="#EF444418" stroke="#EF444438" strokeWidth="1"/>
      <polygon points={zonePts(ZONE_R[2])} fill="#F59E0B14" stroke="#F59E0B28" strokeWidth="1"/>
      <polygon points={zonePts(ZONE_R[1])} fill="#22C55E14" stroke="#22C55E2A" strokeWidth="1"/>
      {/* Axis lines */}
      {AXES.map((_,i)=>{ const e=axPt(i,ZONE_R[3]); return <line key={i} x1={CX} y1={CY} x2={e.x} y2={e.y} stroke="#1A3050" strokeWidth="1"/>; })}
      {/* Data polygon */}
      <polygon points={dataPts(scores)} fill="rgba(45,212,191,.16)" stroke="#2DD4BF" strokeWidth="2.2" strokeLinejoin="round"/>
      {/* Score dots */}
      {scores.map((s,i)=>{
        const p=axPt(i,ZONE_R[s]||ZONE_R[1]);
        const dc=s===1?'#22C55E':s===2?'#F59E0B':'#EF4444';
        return <circle key={i} cx={p.x} cy={p.y} r="6" fill={dc} stroke="#060D14" strokeWidth="1.5"/>;
      })}
      {/* Axis labels */}
      {AXES.map((ax,i)=>{
        const p=axPt(i,LABEL_R); const ls=ax.split('\n'); const lh=14;
        return (
          <text key={i} x={p.x} y={p.y-(ls.length-1)*lh/2} textAnchor="middle" fontSize="12" fill="#CBD5E1" fontFamily="Inter,sans-serif" fontWeight="500">
            {ls.map((l,j)=><tspan key={j} x={p.x} dy={j===0?0:lh}>{l}</tspan>)}
          </text>
        );
      })}
      {/* Center */}
      <circle cx={CX} cy={CY} r="4" fill="#2DD4BF" opacity=".55"/>
      {/* Zone labels inline */}
      <text x={CX+(ZONE_R[1]+ZONE_R[1]*.0)*.55} y={CY-4} textAnchor="middle" fontSize="10" fill="#22C55EAA" fontFamily="Inter" fontWeight="700" letterSpacing="1">LOW</text>
      <text x={CX+(ZONE_R[1]+ZONE_R[2])/2} y={CY-4} textAnchor="middle" fontSize="10" fill="#F59E0BAA" fontFamily="Inter" fontWeight="700" letterSpacing="1">MOD</text>
      <text x={CX+(ZONE_R[2]+ZONE_R[3])/2} y={CY-4} textAnchor="middle" fontSize="10" fill="#EF4444AA" fontFamily="Inter" fontWeight="700" letterSpacing="1">HIGH</text>
    </svg>
  );
}

/* ─── PERIO CHART TAB (Phase 3: SVG overlays + keyboard + toast) ──────────────
   Cells expose stable IDs `perio-${fdi}-${siteKey}-${field}` so the keyboard
   navigator (in PerioChartTab) can refocus across teeth without ref plumbing. */
const cellId = (fdi, siteKey, field) => `perio-${fdi}-${siteKey}-${field}`;

function SiteCell({fdi, siteKey, site, onUpdate, onKey}){
  const pd = site.pd, gm = site.gm;
  const pdHigh = pd != null && pd >= 6;
  const pdMid  = pd != null && pd >= 5 && pd < 6;
  const pdClass = pdHigh ? 'pd-high' : pdMid ? 'pd-mid' : '';
  const [focused, setFocused] = useState(false);
  const setNum = (key, v) => {
    const num = v === '' ? null : parseFloat(v);
    onUpdate({...site, [key]: isNaN(num) ? null : num});
  };
  const handleKey = (field) => (e) => onKey && onKey(e, fdi, siteKey, field);
  return (
    <div className={`site-cell ${pdClass}${focused?' cell-focused':''}`}>
      <input id={cellId(fdi,siteKey,'pd')} type="number" min="0" max="15" step="1" inputMode="numeric"
        value={pd ?? ''} onChange={e => setNum('pd', e.target.value)}
        onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        onKeyDown={handleKey('pd')}
        className={pdClass}
        data-fdi={fdi} data-site={siteKey} data-field="pd"
        title="PD (mm)" aria-label={`Probing depth, tooth ${fdi}, site ${siteKey}`}/>
      <input id={cellId(fdi,siteKey,'gm')} type="number" min="-5" max="15" step="1" inputMode="numeric"
        value={gm ?? ''} onChange={e => setNum('gm', e.target.value)}
        onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        onKeyDown={handleKey('gm')}
        className="gm"
        data-fdi={fdi} data-site={siteKey} data-field="gm"
        title="GM (mm, + = recession)" aria-label={`Gingival margin, tooth ${fdi}, site ${siteKey}`}/>
      <div className="site-dots">
        <span className={`site-dot${site.bop?' bop':''}`} title="BOP" role="checkbox" aria-checked={site.bop}
          tabIndex={0} onClick={()=>onUpdate({...site, bop:!site.bop})}
          onKeyDown={e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); onUpdate({...site, bop:!site.bop}); }}}/>
        <span className={`site-dot${site.sup?' sup':''}`} title="SUP" role="checkbox" aria-checked={site.sup}
          tabIndex={0} onClick={()=>onUpdate({...site, sup:!site.sup})}
          onKeyDown={e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); onUpdate({...site, sup:!site.sup}); }}}/>
        <span className={`site-dot${site.plaque?' plaque':''}`} title="Plaque" role="checkbox" aria-checked={site.plaque}
          tabIndex={0} onClick={()=>onUpdate({...site, plaque:!site.plaque})}
          onKeyDown={e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); onUpdate({...site, plaque:!site.plaque}); }}}/>
      </div>
    </div>
  );
}

function MobilityMarker({mobility}){
  return (
    <div className="mobility-marker" aria-hidden="true">
      {[1,2,3].map(i => <span key={i} className={`dot${i<=mobility?' on':''}`}/>)}
    </div>
  );
}

function FurcationGlyph({furc}){
  if(furc===0) return null;
  const roman = ['','I','II','III'][furc];
  return (
    <span className={`furc-glyph f${furc}`} title={`Furcation ${roman}`}>
      <svg viewBox="0 0 10 10" width="10" height="10" role="img" aria-label={`Furcation ${roman}`}>
        <polygon points="5,1 9,9 1,9" fill={furc===3?'#FCA5A5':'none'} stroke="#FCA5A5" strokeWidth="1"/>
        {furc===2 && <polygon points="5,1 9,9 5,9" fill="#FCA5A5" stroke="none"/>}
      </svg>
    </span>
  );
}

function ToothCrown({fdi, tooth, onUpdateTooth}){
  const cycleMob   = () => onUpdateTooth({...tooth, mobility: (tooth.mobility+1)%4});
  const cycleFurc  = () => onUpdateTooth({...tooth, furcation:(tooth.furcation+1)%4});
  const toggleMissing = () => onUpdateTooth({...tooth, missing:!tooth.missing});
  const toggleImplant = () => onUpdateTooth({...tooth, implant:!tooth.implant});
  return (
    <div className="tooth-crown-strip">
      <MobilityMarker mobility={tooth.mobility}/>
      <div className={`tooth-crown${tooth.missing?' missing':''}`} style={tooth.missing?{opacity:.3,borderStyle:'dashed'}:null}>
        <div className="tooth-num">{fdi}</div>
        <div className="tooth-flags">
          <FurcationGlyph furc={tooth.furcation}/>
          {tooth.implant && <span style={{color:'#5EEAD4',fontSize:'.55rem'}}>imp</span>}
        </div>
        <div className="tooth-actions">
          <button onClick={cycleMob}    className={tooth.mobility>0?'active':''}    title="cycle mobility (m)">m</button>
          <button onClick={cycleFurc}   className={tooth.furcation>0?'active':''}   title="cycle furcation (f)">f</button>
          <button onClick={toggleImplant} className={tooth.implant?'active':''}     title="toggle implant (i)">i</button>
          <button onClick={toggleMissing} className={tooth.missing?'active':''}     title="toggle missing (x)">x</button>
        </div>
      </div>
    </div>
  );
}

function ToothSites({fdi, tooth, keys, onUpdateSite, onKey}){
  if(tooth.missing) return <div className="tooth-sites missing" role="gridcell"
    aria-label={`Tooth ${fdi} missing`}/>;
  return (
    <div className="tooth-sites" role="gridcell" aria-label={`Tooth ${fdi} sites`}>
      {keys.map(k =>
        <SiteCell key={k} fdi={fdi} siteKey={k}
          site={tooth.sites[k]}
          onUpdate={u => onUpdateSite(k, u)}
          onKey={onKey}/>
      )}
    </div>
  );
}

/* RowOverlay — SVG line through PD/GM points across the full arch row.
   Positions are analytical from CSS constants (tooth pitch 71, cell pitch 23,
   first-cell offset 11). PD line solid blue, GM line dashed red. Skips null
   sites (line breaks rather than dropping to zero — clinically faithful). */
function RowOverlay({teeth, chart, keys}){
  const TOOTH_PITCH = 71, CELL_PITCH = 23, CELL_OFFSET_X = 11;
  const PD_Y = 9, GM_Y = 28, H = 47;
  const W = teeth.length * TOOTH_PITCH - 3;
  const pdPts = [], gmPts = [];
  teeth.forEach((fdi, i) => {
    const tooth = chart[fdi];
    keys.forEach((k, j) => {
      const x = i * TOOTH_PITCH + CELL_OFFSET_X + j * CELL_PITCH;
      const s = tooth.missing ? null : tooth.sites[k];
      pdPts.push({x, y: PD_Y, val: s ? s.pd : null});
      gmPts.push({x, y: GM_Y, val: s ? s.gm : null});
    });
  });
  const buildPath = (pts) => {
    let d = '', moving = true;
    for(const p of pts){
      if(p.val == null){ moving = true; continue; }
      d += (moving ? `M${p.x} ${p.y}` : ` L${p.x} ${p.y}`);
      moving = false;
    }
    return d;
  };
  return (
    <svg className="row-overlay" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true">
      <path className="pd-line" d={buildPath(pdPts)}/>
      <path className="gm-line" d={buildPath(gmPts)}/>
      {pdPts.filter(p => p.val != null).map((p,i) =>
        <circle key={'p'+i} className="pd-dot" cx={p.x} cy={p.y} r="1.6"/>
      )}
      {gmPts.filter(p => p.val != null).map((p,i) =>
        <circle key={'g'+i} className="gm-dot" cx={p.x} cy={p.y} r="1.6"/>
      )}
    </svg>
  );
}

function PerioArch({teeth, chart, isUpperArch, onUpdateTooth, onUpdateSite, onKey, ariaLabel}){
  const topKeys    = isUpperArch ? BUCCAL_KEYS  : LINGUAL_KEYS;
  const bottomKeys = isUpperArch ? LINGUAL_KEYS : BUCCAL_KEYS;
  const topRowLabel    = isUpperArch ? 'Buccal sites' : 'Lingual sites';
  const bottomRowLabel = isUpperArch ? 'Lingual sites' : 'Buccal sites';
  return (
    <div className="arch-band" role="rowgroup" aria-label={ariaLabel}>
      <div className="arch-strip">
        <div className="arch-strip-content" role="row" aria-label={topRowLabel}>
          {teeth.map(fdi =>
            <ToothSites key={fdi} fdi={fdi} tooth={chart[fdi]} keys={topKeys}
              onUpdateSite={(k,u)=>onUpdateSite(fdi,k,u)} onKey={onKey}/>
          )}
          <RowOverlay teeth={teeth} chart={chart} keys={topKeys}/>
        </div>
      </div>
      <div className="arch-strip" role="presentation">
        <div className="arch-strip-content" role="presentation">
          {teeth.map(fdi =>
            <ToothCrown key={fdi} fdi={fdi} tooth={chart[fdi]}
              onUpdateTooth={(p)=>onUpdateTooth(fdi,p)}/>
          )}
        </div>
      </div>
      <div className="arch-strip">
        <div className="arch-strip-content" role="row" aria-label={bottomRowLabel}>
          {teeth.map(fdi =>
            <ToothSites key={fdi} fdi={fdi} tooth={chart[fdi]} keys={bottomKeys}
              onUpdateSite={(k,u)=>onUpdateSite(fdi,k,u)} onKey={onKey}/>
          )}
          <RowOverlay teeth={teeth} chart={chart} keys={bottomKeys}/>
        </div>
      </div>
    </div>
  );
}

function PerioChartTab({chart, setChart, t}){
  /* Quick live counts for the header pills (lightweight; full derivation comes Phase 2). */
  const stats = useMemo(() => {
    let measured=0, bop=0, plaque=0, maxPD=0, worstCAL=0;
    for(const fdi of Object.keys(chart)){
      const tooth = chart[fdi];
      if(tooth.missing) continue;
      for(const k of SITE_KEYS){
        const s = tooth.sites[k];
        if(s.pd != null){
          measured++;
          if(s.pd > maxPD) maxPD = s.pd;
          const cal = (s.pd ?? 0) + (s.gm ?? 0);
          if(cal > worstCAL) worstCAL = cal;
        }
        if(s.bop) bop++;
        if(s.plaque) plaque++;
      }
    }
    const pct = (n) => measured ? Math.round((n/measured)*100) : 0;
    return {measured, fmbs:pct(bop), fmps:pct(plaque), maxPD, worstCAL};
  }, [chart]);

  const updateTooth = (fdi, partial) =>
    setChart(prev => ({...prev, [fdi]: {...prev[fdi], ...partial}}));
  const updateSite = (fdi, k, updated) =>
    setChart(prev => ({...prev, [fdi]: {...prev[fdi], sites: {...prev[fdi].sites, [k]: updated}}}));

  /* Last-action toast — also voiced via aria-live for screen readers. */
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);
  const announce = (msg) => {
    setToast(msg);
    if(toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 1500);
  };
  useEffect(() => () => { if(toastTimer.current) clearTimeout(toastTimer.current); }, []);

  /* Keyboard navigation — ←→ jumps sites within the same row+arch (skipping
     missing teeth), ↑↓ swaps PD↔GM within the same site. Tooth-level hotkeys
     (b/s/p/f/m/x/i) read the focused cell's data-attrs to know which tooth/site
     to act on. Modifier keys (ctrl/alt/meta) are ignored so browser/OS combos
     still work. */
  const focusCell = (fdi, siteKey, field) => {
    const el = document.getElementById(cellId(fdi, siteKey, field));
    if(el){ el.focus(); el.select && el.select(); }
  };
  const navigateRow = (fdi, siteKey, field, dx) => {
    const inMaxilla = FDI_MAXILLA.includes(fdi);
    const arch = inMaxilla ? FDI_MAXILLA : FDI_MANDIBLE;
    const isBuccal = BUCCAL_KEYS.includes(siteKey);
    const rowKeys = isBuccal ? BUCCAL_KEYS : LINGUAL_KEYS;
    const seq = [];
    for(const f of arch) for(const k of rowKeys) seq.push({fdi:f, siteKey:k});
    let idx = seq.findIndex(s => s.fdi===fdi && s.siteKey===siteKey);
    if(idx < 0) return;
    idx += dx;
    while(idx>=0 && idx<seq.length && chart[seq[idx].fdi].missing) idx += dx;
    if(idx<0 || idx>=seq.length) return;
    focusCell(seq[idx].fdi, seq[idx].siteKey, field);
  };

  const handleKey = (e, fdi, siteKey, field) => {
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    const lower = k.toLowerCase();
    const tooth = chart[fdi];
    const site = tooth.sites[siteKey];
    const toothLabel = `${t('toastTooth')}${fdi}`;
    if(k === 'ArrowRight'){ e.preventDefault(); navigateRow(fdi, siteKey, field, 1); return; }
    if(k === 'ArrowLeft'){  e.preventDefault(); navigateRow(fdi, siteKey, field, -1); return; }
    if(k === 'ArrowUp' || k === 'ArrowDown'){
      e.preventDefault();
      focusCell(fdi, siteKey, field==='pd'?'gm':'pd'); return;
    }
    if(k === 'Enter'){
      e.preventDefault();
      if(field==='pd') focusCell(fdi, siteKey, 'gm');
      else navigateRow(fdi, siteKey, 'pd', 1);
      return;
    }
    if(k === 'Escape'){ e.preventDefault(); e.target.blur(); return; }
    if(lower === 'b'){ e.preventDefault();
      updateSite(fdi, siteKey, {...site, bop:!site.bop});
      announce(site.bop ? t('toastBopOff') : t('toastBopOn')); return; }
    if(lower === 's'){ e.preventDefault();
      updateSite(fdi, siteKey, {...site, sup:!site.sup});
      announce(site.sup ? t('toastSupOff') : t('toastSupOn')); return; }
    if(lower === 'p'){ e.preventDefault();
      updateSite(fdi, siteKey, {...site, plaque:!site.plaque});
      announce(site.plaque ? t('toastPlaqueOff') : t('toastPlaqueOn')); return; }
    if(lower === 'g'){ e.preventDefault();
      focusCell(fdi, siteKey, field==='pd'?'gm':'pd'); return; }
    if(lower === 'f'){ e.preventDefault();
      const next = (tooth.furcation+1)%4;
      updateTooth(fdi, {furcation: next});
      announce(`${toothLabel} · ${t('toastFurc')}${['0','I','II','III'][next]}`); return; }
    if(lower === 'm'){ e.preventDefault();
      const next = (tooth.mobility+1)%4;
      updateTooth(fdi, {mobility: next});
      announce(`${toothLabel} · ${t('toastMob')}${next}`); return; }
    if(lower === 'x'){ e.preventDefault();
      updateTooth(fdi, {missing:!tooth.missing});
      announce(`${toothLabel} · ${tooth.missing ? t('toastMissingOff') : t('toastMissingOn')}`); return; }
    if(lower === 'i'){ e.preventDefault();
      updateTooth(fdi, {implant:!tooth.implant});
      announce(`${toothLabel} · ${tooth.implant ? t('toastImplantOff') : t('toastImplantOn')}`); return; }
  };

  const handleReset = () => {
    if(window.confirm(t('chartResetConfirm'))) setChart(createBlankChart());
  };

  /* View mode (Phase 4) — full / single arch / single quadrant. Default picked
     from initial viewport width; user can override at any time and the choice
     persists for the session. Quadrant numbering follows clinical convention
     (Q1 = upper-right ... Q4 = lower-right, FDI quadrants 1..4). */
  const [chartView, setChartView] = useState(() => {
    if (typeof window === 'undefined') return 'full';
    const w = window.innerWidth;
    if (w >= 1024) return 'full';
    if (w >= 768)  return 'maxilla';
    return 'q1';
  });
  const userTouchedView = useRef(false);
  const setView = (v) => { userTouchedView.current = true; setChartView(v); };
  /* Auto-shift defaults when the viewport crosses a breakpoint, but only while
     the user hasn't manually picked a view — once they touch the toggle their
     choice sticks regardless of resize / orientation change. */
  useEffect(() => {
    const onResize = () => {
      if (userTouchedView.current) return;
      const w = window.innerWidth;
      const next = w >= 1024 ? 'full' : w >= 768 ? 'maxilla' : 'q1';
      setChartView(next);
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const QUADRANTS = {
    q1: { teeth: FDI_MAXILLA.slice(0,8),  upper:true,  archLabel:'Quadrant 1, upper right' },
    q2: { teeth: FDI_MAXILLA.slice(8),    upper:true,  archLabel:'Quadrant 2, upper left' },
    q3: { teeth: FDI_MANDIBLE.slice(8),   upper:false, archLabel:'Quadrant 3, lower left' },
    q4: { teeth: FDI_MANDIBLE.slice(0,8), upper:false, archLabel:'Quadrant 4, lower right' },
  };
  const renderArches = () => {
    const archProps = { chart, onUpdateTooth:updateTooth, onUpdateSite:updateSite, onKey:handleKey };
    if(chartView === 'full') return (<>
      <PerioArch teeth={FDI_MAXILLA}  isUpperArch={true}  ariaLabel="Maxilla"  {...archProps}/>
      <div className="arch-divider"/>
      <PerioArch teeth={FDI_MANDIBLE} isUpperArch={false} ariaLabel="Mandible" {...archProps}/>
    </>);
    if(chartView === 'maxilla')  return <PerioArch teeth={FDI_MAXILLA}  isUpperArch={true}  ariaLabel="Maxilla"  {...archProps}/>;
    if(chartView === 'mandible') return <PerioArch teeth={FDI_MANDIBLE} isUpperArch={false} ariaLabel="Mandible" {...archProps}/>;
    const q = QUADRANTS[chartView];
    return <PerioArch teeth={q.teeth} isUpperArch={q.upper} ariaLabel={q.archLabel} {...archProps}/>;
  };
  const viewBtn = (key, label) => (
    <button onClick={()=>setView(key)} className={chartView===key?'active':''}
      aria-pressed={chartView===key}>{label}</button>
  );
  const showArchLabel = chartView === 'full' || chartView === 'maxilla' || /^q[12]$/.test(chartView);
  const showMandLabel = chartView === 'full' || chartView === 'mandible' || /^q[34]$/.test(chartView);

  return (
    <div className="fade-in tab-content" style={{padding:'20px 12px',maxWidth:1400,margin:'0 auto'}}>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
        <div style={{fontSize:'.72rem',fontWeight:700,letterSpacing:'.08em',color:'#2DD4BF',
          textTransform:'uppercase'}}>{t('chartTitle')}</div>
      </div>
      <div style={{fontSize:'.78rem',color:'#94A3B8',marginBottom:14,lineHeight:1.55}}>{t('chartSubtitle')}</div>

      {/* Live header pills */}
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <span className="chart-pill"><span className="label">{t('chartFMBS')}</span><span className="val">{stats.fmbs}%</span></span>
        <span className="chart-pill"><span className="label">{t('chartFMPS')}</span><span className="val">{stats.fmps}%</span></span>
        <span className="chart-pill"><span className="label">{t('chartMaxPD')}</span><span className="val">{stats.maxPD || '—'}{stats.maxPD?' mm':''}</span></span>
        <span className="chart-pill"><span className="label">{t('chartWorstCAL')}</span><span className="val">{stats.worstCAL || '—'}{stats.worstCAL?' mm':''}</span></span>
        <span style={{fontSize:'.7rem',color:'#64748B',marginInlineStart:8}}>· {stats.measured} sites</span>
        <button onClick={handleReset} style={{
          marginInlineStart:'auto',background:'#0F2035',color:'#94A3B8',
          border:'1px solid #1A3050',borderRadius:6,padding:'5px 12px',
          fontSize:'.74rem',cursor:'pointer',fontFamily:'Heebo,Arial,sans-serif'
        }}>{t('chartReset')}</button>
      </div>

      {/* View toggle — Full / Maxilla / Mandible / Q1-Q4 */}
      <div className="chart-view-toggle" role="group" aria-label={t('chartViewLabel')}>
        <span className="label">{t('chartViewLabel')}</span>
        {viewBtn('full',     t('chartViewFull'))}
        <span className="sep" aria-hidden="true"/>
        {viewBtn('maxilla',  t('chartViewMaxilla'))}
        {viewBtn('mandible', t('chartViewMandible'))}
        <span className="sep" aria-hidden="true"/>
        {viewBtn('q1', t('chartViewQ1'))}
        {viewBtn('q2', t('chartViewQ2'))}
        {viewBtn('q3', t('chartViewQ3'))}
        {viewBtn('q4', t('chartViewQ4'))}
      </div>

      {/* Chart — horizontally scrollable on narrow screens */}
      <div className="perio-chart-wrap" style={{overflowX:'auto',padding:'10px 0',background:'#080F18',borderRadius:10,border:'1px solid #0F2035'}}>
        <div className="perio-chart" role="grid" aria-label={t('chartGridLabel')}>
          {showArchLabel && (
            <div style={{fontSize:'.62rem',color:'#475569',letterSpacing:'.1em',textTransform:'uppercase',
              textAlign:'center',marginBottom:2,fontFamily:'Inter,sans-serif'}}>{t('chartMaxilla')}</div>
          )}
          {renderArches()}
          {showMandLabel && (
            <div style={{fontSize:'.62rem',color:'#475569',letterSpacing:'.1em',textTransform:'uppercase',
              textAlign:'center',marginTop:2,fontFamily:'Inter,sans-serif'}}>{t('chartMandible')}</div>
          )}
        </div>
      </div>

      {/* Legend */}
      <div style={{display:'flex',gap:14,marginTop:14,flexWrap:'wrap',fontSize:'.74rem',color:'#94A3B8',alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span style={{width:18,height:2,background:'#3B82F6',display:'inline-block'}}/>PD
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span style={{width:18,height:0,borderTop:'2px dashed #EF4444',display:'inline-block'}}/>GM
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span className="site-dot bop"/>{t('chartLegendBOP')}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span className="site-dot sup"/>{t('chartLegendSUP')}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span className="site-dot plaque"/>{t('chartLegendPlaque')}
        </div>
        <div style={{color:'#475569',fontSize:'.68rem',marginInlineStart:'auto',fontFamily:'Inter,sans-serif'}}>
          {t('chartHotkeys')}
        </div>
      </div>

      {/* Last-action toast — also a polite live region for screen readers */}
      <div role="status" aria-live="polite" aria-atomic="true" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>{toast}</div>
      {toast && <div className="last-action-toast" key={toast + Date.now()}>{toast}</div>}
    </div>
  );
}

  const txLabel=txStatus==='stable'?t('txStable'):txStatus==='remission'?t('txRemission'):txStatus==='unstable'?t('txUnstable'):txStatus==='therapy'?t('txTherapy'):t('txUntreated');
  const txColor=txStatus==='stable'?'#22C55E':txStatus==='remission'?'#F59E0B':txStatus==='unstable'?'#EF4444':'#94A3B8';
  return (
    <div className="fade-in tab-content" style={{padding:'20px 16px',maxWidth:960,margin:'0 auto'}}>
      <div style={{display:'flex',gap:14,marginBottom:18,flexWrap:'wrap',justifyContent:'center'}}>
        <StageBadge stage={dx.stage}/>
        <GradeBadge grade={dx.grade}/>
        <div className="badge-ext" style={{background:'#0C1A28',border:'1px solid #1A3050',borderRadius:16,
          padding:'14px 28px',textAlign:'center',minWidth:110}}>
          <div style={{fontSize:'.6rem',fontWeight:600,letterSpacing:'.1em',color:'#64748B',marginBottom:4}}>{t('extLabel').toUpperCase()}</div>

/* ─── OUTPUT TAB ─────────────────────────────────────────────────────────────── */
function OutputTab({dx,risk,periDx,caseType,txStatus,icd,chartFilled,chartDerived,st,lang,age,t}){
  const [copied,setCopied]=useState(false);

  const letter=useMemo(()=>{
    return makeLetter({
      lang, name:st.patientName, age,
      patientID:st.patientID, mrn:st.mrn,
      stage:dx?dx.stage:null, grade:dx?dx.grade:null, extent:dx?dx.extent:null,
      caseType, txStatus, icd,
      /* When the chart is filled, prefer derived values for the letter findings
         line (matches what the staging engine actually used). */
      cal: chartFilled ? String(chartDerived.calWorst) : st.calWorst,
      rbl: st.rblPercent,
      pd:  chartFilled ? String(chartDerived.maxPD)    : st.maxPD,
      bop: chartFilled ? String(chartDerived.bopPercent) : st.bopPercent,
      cigs:st.smokingCigs, packYears:st.packYears,
      hba1c:st.hba1c, idraRisk:risk, periDx,
      residentName:st.residentName, licenseNo:st.licenseNo,
      attendingName:st.attendingName, attendingLicense:st.attendingLicense,
      chartFilled, chartDerived
    });
  },[dx,risk,periDx,caseType,txStatus,icd,chartFilled,chartDerived,st,lang,age]);

  const isPerio = caseType==='periodontitis';
  if(isPerio && !dx) return <div style={{padding:48,textAlign:'center',color:'#64748B'}}>{t('noData')}</div>;

  const extLabel = dx ? (t(dx.extent)||t('undef')) : '';
  const ctKey = {health:'ctHealth',gingivitis:'ctGingivitis',npd:'ctNPD',endoPerio:'ctEndoPerio',periodontitis:'ctPerio'}[caseType];
  const diagLine = isPerio
    ? `Periodontitis Stage ${dx.stage} Grade ${dx.grade} — ${extLabel} | ICD: ${icd} | IDRA: ${risk}`
    : `${ctKey?t(ctKey):(caseType||'—')} | ICD: ${icd}`;

  /* PHI hygiene: clear clipboard after 60s so the patient's letter doesn't sit
     in the OS paste buffer indefinitely. Best-effort — silently no-ops if the
     user has copied something else in the meantime (we don't read clipboard). */
  const handleCopy=()=>{
    navigator.clipboard.writeText(letter).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false),2500);
      setTimeout(()=>{ try{ navigator.clipboard.writeText(''); }catch(e){} }, 60000);
    });
  };

  const today = new Date().toLocaleDateString(lang==='he'?'he-IL':'en-GB');

  return (
    <div className="fade-in tab-content" style={{padding:'20px 16px',maxWidth:960,margin:'0 auto'}}>
      {/* Print-only header — appears only on printed page */}
      <div className="print-only print-header" dir={lang==='he'?'rtl':'ltr'}>
        <h1>{lang==='he'?'מכתב הפנייה — מחלקת פריודונטולוגיה רמב"ם':'Referral Letter — Rambam Periodontology'}</h1>
        <div className="meta">
          <div>{(lang==='he'?'מטופל: ':'Patient: ') + (st.patientName||'—') + (age?` · ${lang==='he'?'גיל':'Age'}: ${age}`:'')}</div>
          <div>{(lang==='he'?'תאריך: ':'Date: ') + today}</div>
          <div className="clinical-num" style={{marginTop:'2mm'}}>{diagLine}</div>
        </div>
      </div>

      <Card title={t('diagTitle')} style={{marginBottom:16}}>
        <div style={{background:'#0F2035',borderRadius:10,padding:'13px 16px',
          fontFamily:'Inter,sans-serif',fontSize:'.96rem',fontWeight:600,color:'#5EEAD4',
          direction:'ltr',letterSpacing:'.01em'}}>
          {diagLine}
        </div>
        <div style={{marginTop:12}}>
          <div style={{fontSize:'.66rem',fontWeight:700,letterSpacing:'.08em',
            textTransform:'uppercase',color:'#64748B',marginBottom:6}}>{t('sptInt')}</div>
          <div style={{display:'inline-flex',alignItems:'center',gap:8,
            background:'#0C1A28',border:'1px solid #2DD4BF44',borderRadius:8,
            padding:'6px 14px'}}>
            <span style={{fontSize:'.95rem',fontWeight:700,color:'#5EEAD4',fontFamily:'Inter,sans-serif'}}>{t(sptIntervalKey(risk))}</span>
          </div>
          <div style={{fontSize:'.68rem',color:'#64748B',marginTop:6}}>{t('sptSrc')}</div>
        </div>
      </Card>

      <Card title={t('letterTitle')}>
        {/* Screen view: editable-feel textarea (hidden on print via CSS) */}
        <textarea className="field-input"
          readOnly value={letter}
          lang={lang}
          aria-label={t('letterTitle')}
          style={{direction:lang==='he'?'rtl':'ltr',textAlign:lang==='he'?'right':'left'}}/>
        {/* Print view: full-flow letter (hidden on screen via CSS) */}
        <div className="print-only print-letter" dir={lang==='he'?'rtl':'ltr'}>{letter}</div>
        <div style={{display:'flex',gap:12,marginTop:14}}>
          <button onClick={handleCopy} style={{
            display:'flex',alignItems:'center',gap:7,
            background:copied?'#052E16':'#0F2035',
            color:copied?'#4ADE80':'#2DD4BF',
            border:`1px solid ${copied?'#4ADE8055':'#2DD4BF44'}`,
            borderRadius:8,padding:'9px 18px',cursor:'pointer',
            fontFamily:'Heebo,Arial,sans-serif',fontWeight:600,fontSize:'.84rem',transition:'all .2s'
          }}>
            {copied?<IconCheck/>:<IconCopy/>}
            {copied?t('btnCopied'):t('btnCopy')}
          </button>
          <button onClick={()=>window.print()} style={{
            display:'flex',alignItems:'center',gap:7,
            background:'#0F2035',color:'#94A3B8',border:'1px solid #1A3050',
            borderRadius:8,padding:'9px 18px',cursor:'pointer',
            fontFamily:'Heebo,Arial,sans-serif',fontWeight:600,fontSize:'.84rem'
          }}>
            <IconPrint/> {t('btnPrint')}
          </button>
        </div>
        {copied && <div role="status" aria-live="polite" style={{marginTop:8,fontSize:'.7rem',color:'#94A3B8'}}>{t('clipboardNote')}</div>}
      </Card>
    </div>
  );
}

/* ─── TAB BAR ─────────────────────────────────────────────────────────────────── */
function TabBar({active,setActive,t}){
  const tabs=[['tabInput'],['tabChart'],['tabDx'],['tabIDRA'],['tabOut'],['tabRefs']];
  const onKey = (e, i) => {
    if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); setActive((i+1)%tabs.length); }
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); setActive((i-1+tabs.length)%tabs.length); }
    else if(e.key==='Home'){ e.preventDefault(); setActive(0); }
    else if(e.key==='End'){ e.preventDefault(); setActive(tabs.length-1); }
  };
  return (
    <div className="no-print tab-bar-wrap" role="tablist" aria-label="Tabs" style={{
      position:'sticky',top:54,zIndex:90,background:'#060D14',
      borderBottom:'1px solid #1A3050',display:'flex',overflowX:'auto',paddingInlineStart:10
    }}>
      {tabs.map(([k],i)=>(
        <button key={k} role="tab"
          aria-selected={active===i}
          id={`tab-${k}`}
          tabIndex={active===i?0:-1}
          onKeyDown={e=>onKey(e,i)}
          className={`tab-btn${active===i?' tab-active':''}`} onClick={()=>setActive(i)}>
          {t(k)}
        </button>
      ))}
    </div>
  );
}

    const next=lang==='he'?'en':'he';
    document.documentElement.lang=next;
    document.documentElement.dir=next==='he'?'rtl':'ltr';
    setLang(next);
  };

  const age=useMemo(()=>{
    if(!patientDOB) return null;
    const now=new Date(), birth=new Date(patientDOB);
    let a=now.getFullYear()-birth.getFullYear();
    const m=now.getMonth()-birth.getMonth();
    if(m<0||(m===0&&now.getDate()<birth.getDate())) a--;
    return a>0?a:null;
  },[patientDOB]);

  /* Chart-derived stats. When the chart has any measured sites (chartFilled=true),
     these replace the manual worst-site fields piped into the engine. */
  const chartDerived=useMemo(()=>computeChartDerived(chart),[chart]);
  const chartFilled=chartDerived.measured>0;

  const dx=useMemo(()=>computeDiagnosis({
    calWorst:    chartFilled ? String(chartDerived.calWorst)     : calWorst,
    rblPercent,
    maxPD:       chartFilled ? String(chartDerived.maxPD)        : maxPD,
    vbl,
    furcation:   chartFilled ? String(chartDerived.furcationMax) : furcation,
    mobility:    chartFilled ? String(chartDerived.mobilityMax)  : mobility,
    teethLost,
    teethAffected: chartFilled ? String(chartDerived.teethAffected) : teethAffected,
    mastDys, smokingCigs, hba1c, age
  }),[chartFilled,chartDerived,calWorst,rblPercent,maxPD,vbl,furcation,mobility,
    teethLost,teethAffected,mastDys,smokingCigs,hba1c,age]);

  const blAgeComp=useMemo(()=>{
    if(blAgeRatio!=='') return parseFloat(blAgeRatio);
    if(!age||!rblPercent) return null;
    return parseFloat(rblPercent)/age;
  },[blAgeRatio,rblPercent,age]);

  const blAgeScore=blAgeComp===null?1:blAgeComp<=0.5?1:blAgeComp<=1.0?2:3;

  const bopScore=useMemo(()=>{
    const b = chartFilled ? chartDerived.bopPercent : parseFloat(bopPercent);
    if(isNaN(b)) return 1;
    return b<=10?1:b<=30?2:3;
  },[chartFilled,chartDerived.bopPercent,bopPercent]);

  const pdSitesScore=useMemo(()=>{
    if(chartFilled) return chartDerived.pdSitesScore;
    return parseInt(pdSites)||1;
  },[chartFilled,chartDerived.pdSitesScore,pdSites]);

  const idraScores=useMemo(()=>[
    parseInt(histPerio),bopScore,pdSitesScore,
    blAgeScore,parseInt(suspClass),parseInt(sptComp),
    parseInt(restMargin),parseInt(cleanability),
  ],[histPerio,bopScore,pdSitesScore,blAgeScore,suspClass,sptComp,restMargin,cleanability]);

  const idraRisk=useMemo(()=>computeIDRARisk(idraScores),[idraScores]);

  const periDx=useMemo(()=>computePeriImplantDx({
    hasImplants, bopSup:piBOPSup, bl:piBL, hasBaseline:piHasBaseline
  }),[hasImplants,piBOPSup,piBL,piHasBaseline]);

  const caseType=useMemo(()=>caseTypeOverride==='auto'
    ? autoCaseType({calWorst,bopPercent})
    : caseTypeOverride,
    [caseTypeOverride,calWorst,bopPercent]);

  const txStatus=useMemo(()=>txStatusOverride==='auto'
    ? autoTxStatus({maxPD,bopPercent})
    : txStatusOverride,
    [txStatusOverride,maxPD,bopPercent]);

  const icd=useMemo(()=>icd10For({caseType,stage:dx?dx.stage:null}),[caseType,dx]);

  const idValid=useMemo(()=>!patientID||validIsraeliID(patientID),[patientID]);

  const state={
    patientName,patientID,mrn,patientDOB,patientGender,smokingCigs,packYears,hba1c,
    residentName,licenseNo,attendingName,attendingLicense,
    caseTypeOverride,txStatusOverride,
    calWorst,rblPercent,maxPD,vbl,furcation,mobility,bopPercent,
    teethLost,teethAffected,mastDys,
    histPerio,pdSites,blAgeRatio,suspClass,sptComp,restMargin,cleanability,
    hasImplants,piBOPSup,piBL,piPDC,piHasBaseline
  };

  const SETTERS={
    patientName:setPatientName,patientID:setPatientID,mrn:setMrn,
    patientDOB:setPatientDOB,patientGender:setPatientGender,
    smokingCigs:setSmokingCigs,packYears:setPackYears,hba1c:setHba1c,
    residentName:setResidentName,licenseNo:setLicenseNo,
    attendingName:setAttendingName,attendingLicense:setAttendingLicense,
    caseTypeOverride:setCaseTypeOverride,txStatusOverride:setTxStatusOverride,
    calWorst:setCalWorst,rblPercent:setRblPercent,maxPD:setMaxPD,vbl:setVbl,
    furcation:setFurcation,mobility:setMobility,bopPercent:setBopPercent,
    teethLost:setTeethLost,teethAffected:setTeethAffected,mastDys:setMastDys,
    histPerio:setHistPerio,pdSites:setPdSites,blAgeRatio:setBlAgeRatio,
    suspClass:setSuspClass,sptComp:setSptComp,restMargin:setRestMargin,cleanability:setCleanability,
    hasImplants:setHasImplants,piBOPSup:setPiBOPSup,piBL:setPiBL,
    piPDC:setPiPDC,piHasBaseline:setPiHasBaseline
  };
  const set=(k,v)=>SETTERS[k]&&SETTERS[k](v);

  return (
    <div style={{minHeight:'100vh',background:'#060D14'}}>
      <Navbar t={t} lang={lang} onToggle={toggleLang}/>
      <TabBar active={activeTab} setActive={setActiveTab} t={t}/>
      <main id="main-content">
        {activeTab===0&&<InputTab st={state} set={set} t={t} idValid={idValid} chartFilled={chartFilled} chartDerived={chartDerived} setChart={setChart} onCompute={()=>setActiveTab(2)}/>}
        {activeTab===1&&<PerioChartTab chart={chart} setChart={setChart} t={t}/>}
        {activeTab===2&&<DiagTab dx={dx} caseType={caseType} txStatus={txStatus} icd={icd} chartFilled={chartFilled} chartDerived={chartDerived} t={t}/>}
        {activeTab===3&&<IDRATab scores={idraScores} risk={idraRisk} periDx={periDx} t={t}/>}
        {activeTab===4&&<OutputTab dx={dx} risk={idraRisk} periDx={periDx} caseType={caseType} txStatus={txStatus} icd={icd} chartFilled={chartFilled} chartDerived={chartDerived} st={state} lang={lang} age={age} t={t}/>}
        {activeTab===5&&<RefsTab lang={lang} t={t}/>}
      </main>

      <div className="author-signature no-print" aria-hidden="true">
        <span className="sig-prefix">created&nbsp;by</span>
        <span className="sig-name">Dr Roni Gershonovitch</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
