<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; worker-src 'self' blob:; manifest-src 'none'; media-src 'none'"/>
  <meta name="referrer" content="no-referrer"/>
  <title>OctoPerio — כלי תמיכה קלינית פריו-אימפלנט</title>
  <link href="vendor/fonts/google-fonts.css" rel="stylesheet"/>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            perio: {
              bg: '#060D14', surface: '#0C1A28', panel: '#0F2035',
              border: '#1A3050', accent: '#2DD4BF', accentDim: '#1A8A7B',
              text: '#E2E8F0', textDim: '#94A3B8', muted: '#7B8AA4',
            }
          },
          fontFamily: {
            heb: ['Heebo','Arial','sans-serif'],
            en:  ['Inter','system-ui','sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-family:'Heebo',Arial,sans-serif;}
    body{background:#060D14;color:#E2E8F0;min-height:100vh;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:#0C1A28;}
    ::-webkit-scrollbar-thumb{background:#1A3050;border-radius:4px;}

    .field-input{
      background:#0C1A28;border:1px solid #1A3050;border-radius:8px;
      color:#E2E8F0;font-family:'Heebo',Arial,sans-serif;
      font-size:.875rem;padding:8px 12px;width:100%;transition:border-color .15s;
    }
    .field-input:focus{outline:none;border-color:#2DD4BF;box-shadow:0 0 0 3px rgba(45,212,191,.12);}
    select.field-input option{background:#0C1A28;}
    input[type="number"].field-input,input[type="date"].field-input{direction:ltr;text-align:left;font-family:'Inter',sans-serif;}

    .card{background:#0C1A28;border:1px solid #1A3050;border-radius:16px;padding:20px;}
    .card-title{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#2DD4BF;margin-bottom:14px;}

    .tab-btn{padding:12px 22px;min-height:44px;font-weight:700;font-size:.82rem;border-bottom:2px solid transparent;
      color:#7B8AA4;cursor:pointer;transition:all .15s;white-space:nowrap;
      background:none;border-top:none;border-left:none;border-right:none;font-family:'Heebo',Arial,sans-serif;}
    .tab-btn:hover{color:#94A3B8;}
    .tab-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #2DD4BF;border-radius:6px;}
    .tab-active{border-bottom-color:#2DD4BF!important;color:#2DD4BF!important;}

    button:focus-visible{outline:2px solid #2DD4BF;outline-offset:2px;}

    .reasoning-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #0F2035;}
    .reasoning-row:last-child{border-bottom:none;}

    .clinical-num{direction:ltr;font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;}

    .author-signature{
      position:fixed;bottom:14px;
      inset-inline-end:18px;
      z-index:50;pointer-events:none;
      font-family:'Caveat','Heebo',cursive;
      font-weight:600;font-size:1.05rem;
      direction:ltr;
      color:#5EEAD4;opacity:.42;
      letter-spacing:.01em;
      text-shadow:0 1px 8px rgba(45,212,191,.18);
      transition:opacity .25s ease;
      user-select:none;-webkit-user-select:none;
      white-space:nowrap;
      display:none;align-items:baseline;gap:6px;
    }
    /* Watermark is hidden by default on every tab — clinician-facing tool
       should not carry author branding. Pass ?author=1 to opt in (portfolio /
       demo contexts). */
    body.show-author .author-signature{display:flex;}
    .author-signature:hover{opacity:.88;}
    .author-signature .sig-prefix{
      font-family:'Inter',sans-serif;font-weight:400;
      font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
      color:#7B8AA4;
    }
    .author-signature .sig-name{
      font-size:1.25rem;line-height:1;
      background:linear-gradient(95deg,#5EEAD4 0%,#2DD4BF 60%,#1A8A7B 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    /* Move watermark to bottom-START so it never collides with bottom-END action buttons (Print, etc.) */
    .author-signature{bottom:14px;inset-inline-start:18px;inset-inline-end:auto;}
    @media (max-width:520px){
      .author-signature{bottom:8px;inset-inline-start:10px;}
      .author-signature .sig-prefix{display:none;}
      .author-signature .sig-name{font-size:1.05rem;}
    }
    /* Even when ?author=1 is set, suppress the watermark on Output (letter is the artefact). */
    body.tab-output .author-signature{display:none!important;}

    @media (prefers-reduced-motion: reduce){
      .fade-in, *{animation:none!important;transition:none!important;}
    }

    .fade-in{animation:fadeIn .22s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}

    textarea.field-input{resize:vertical;min-height:340px;line-height:1.75;font-size:.82rem;}

    /* ─── Periodontal chart ─── */
    .perio-chart{display:flex;flex-direction:column;gap:18px;direction:ltr;width:max-content;margin:0 auto;}
    .arch-row{display:flex;gap:3px;justify-content:center;}
    .arch-divider{height:1px;background:#1A3050;margin:4px 0;}
    .tooth-col{display:flex;flex-direction:column;gap:2px;align-items:center;width:68px;}
    .tooth-col.missing .tooth-crown{opacity:.3;border-style:dashed;}
    .tooth-crown{width:66px;padding:3px 4px;background:#0F2035;border:1px solid #1A3050;border-radius:5px;
      display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;}
    .tooth-num{font-weight:700;color:#94A3B8;font-family:'Inter',sans-serif;letter-spacing:.02em;}
    .tooth-flags{display:flex;gap:4px;font-size:.55rem;font-family:'Inter',sans-serif;height:11px;align-items:center;}
    .tooth-actions{display:flex;gap:1px;}
    .tooth-actions button{background:transparent;color:#7B8AA4;border:1px solid transparent;
      cursor:pointer;padding:1px 4px;font-size:.6rem;font-family:'Inter',sans-serif;border-radius:3px;line-height:1;}
    .tooth-actions button:hover{color:#5EEAD4;border-color:#1A3050;background:#0C1A28;}
    .tooth-actions button.active{color:#5EEAD4;background:#0C1A28;border-color:#2DD4BF44;}
    .site-row{display:flex;gap:1px;}
    .site-cell{display:flex;flex-direction:column;width:22px;border:1px solid #1A3050;border-radius:3px;
      background:#0C1A28;overflow:hidden;}
    /* Phase 5 — heatmap wash punched up so the chart reads as a clinical
       at-a-glance map. pd-mid (≥5mm) amber; pd-high (≥6mm) red with a 2px
       inset accent on the inline-start edge. */
    .site-cell.pd-mid{background:#7A4A0066;}
    .site-cell.pd-high{background:#5A1A1A99;box-shadow:inset 2px 0 0 #DC2626;}
    [dir="rtl"] .site-cell.pd-high{box-shadow:inset -2px 0 0 #DC2626;}
    .site-cell input{width:100%;height:18px;text-align:center;background:transparent;color:#E2E8F0;
      border:none;border-bottom:1px solid #1A3050;font-size:.7rem;font-weight:600;font-family:'Inter',sans-serif;
      padding:0;outline:none;}
    .site-cell input::-webkit-inner-spin-button,
    .site-cell input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .site-cell input.gm{font-weight:400;color:#94A3B8;}
    .site-cell input.pd-mid{color:#FCD34D;}
    .site-cell input.pd-high{color:#FCA5A5;}
    .site-cell input:focus{background:#1A3050;color:#5EEAD4!important;}
    .site-dots{display:flex;gap:2px;justify-content:center;padding:2px 0;background:#0F2035;}
    .site-dot{width:6px;height:6px;border-radius:50%;cursor:pointer;background:#1A3050;
      transition:background .15s, transform .1s;}
    .site-dot:hover{transform:scale(1.3);}
    .site-dot.bop{background:#EF4444;}
    .site-dot.sup{background:#FCD34D;}
    .site-dot.plaque{background:#94A3B8;}
    .chart-pill{display:inline-flex;align-items:center;gap:6px;background:#0F2035;border:1px solid #1A3050;
      border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:.78rem;}
    .chart-pill .label{color:#94A3B8;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;}
    .chart-pill .val{color:#5EEAD4;font-weight:700;font-variant-numeric:tabular-nums;}

    /* Phase 3 — strip layout, SVG overlay, markers, toast */
    .arch-band{display:flex;flex-direction:column;align-items:center;}
    .arch-strip{display:flex;justify-content:center;width:100%;}
    .arch-strip-content{display:flex;gap:3px;position:relative;}
    .tooth-sites{display:flex;gap:1px;width:68px;flex:0 0 68px;align-items:flex-start;}
    .tooth-sites.missing{height:47px;background:repeating-linear-gradient(45deg,#0F203522 0,#0F203522 4px,transparent 4px,transparent 8px);
      border:1px dashed #1A3050;border-radius:4px;opacity:.4;}
    .tooth-sites-spacer{width:68px;flex:0 0 68px;height:47px;}
    .site-cell{position:relative;z-index:1;}
    .row-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;
      filter:drop-shadow(0 0 1px #060D14) drop-shadow(0 0 1px #060D14);}
    /* Phase 5 — GM line moved off red (#EF4444) which collided with the BOP
       dot semantically. Now amber/orange #FB923C so PD-blue, GM-orange, and
       BOP-red are three distinct clinical channels. Polylines bumped to 2px,
       dash pattern loosened, opacity 1, halo via drop-shadow on the parent. */
    .row-overlay .pd-line{fill:none;stroke:#3B82F6;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
    .row-overlay .gm-line{fill:none;stroke:#FB923C;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
      stroke-dasharray:5 3;}
    .row-overlay .pd-dot{fill:#3B82F6;}
    .row-overlay .gm-dot{fill:#FB923C;}
    .tooth-crown-strip{width:68px;flex:0 0 68px;}
    .mobility-marker{display:flex;gap:3px;justify-content:center;height:6px;align-items:center;margin-bottom:1px;}
    .mobility-marker .dot{width:4px;height:4px;border-radius:50%;background:#1A3050;}
    .mobility-marker .dot.on{background:#FCD34D;box-shadow:0 0 3px #FCD34D88;}
    .furc-glyph{width:10px;height:10px;display:inline-block;vertical-align:middle;}
    .furc-glyph polygon{stroke:#FCA5A5;stroke-width:1;}
    .furc-glyph.f1 polygon{fill:none;}
    .furc-glyph.f2 polygon{fill:url(#furc-half);}
    .furc-glyph.f3 polygon{fill:#FCA5A5;}
    .last-action-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
      background:#0F2035;border:1px solid #2DD4BF;color:#5EEAD4;
      padding:8px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-size:.8rem;
      box-shadow:0 4px 14px rgba(45,212,191,.18);z-index:200;pointer-events:none;
      animation:toastFade 1.5s ease-out forwards;}
    @keyframes toastFade{
      0%{opacity:0;transform:translate(-50%,8px);}
      15%,75%{opacity:1;transform:translate(-50%,0);}
      100%{opacity:0;transform:translate(-50%,-4px);}
    }
    @media (prefers-reduced-motion:reduce){
      .last-action-toast{animation:none;opacity:1;}
    }
    .site-cell.cell-focused{outline:2px solid #2DD4BF;outline-offset:0;}

    /* Phase 4 — view toggle pills + responsive defaults + landscape print */
    .chart-view-toggle{display:flex;gap:4px;flex-wrap:wrap;align-items:center;
      margin-bottom:10px;padding:6px 8px;background:#0F2035;border:1px solid #1A3050;
      border-radius:8px;}
    .chart-view-toggle .label{font-size:.62rem;letter-spacing:.08em;color:#94A3B8;
      text-transform:uppercase;font-weight:700;font-family:'Inter',sans-serif;
      padding:0 6px;}
    .chart-view-toggle button{background:transparent;color:#94A3B8;
      border:1px solid #1A3050;border-radius:6px;padding:4px 10px;
      font-size:.72rem;cursor:pointer;font-family:'Inter',sans-serif;
      letter-spacing:.04em;transition:color .12s,background .12s,border-color .12s;}
    .chart-view-toggle button:hover{color:#5EEAD4;border-color:#1A3050;}
    .chart-view-toggle button.active{background:#0C1A28;color:#5EEAD4;
      border-color:#2DD4BF66;font-weight:700;}
    .chart-view-toggle .sep{width:1px;height:18px;background:#1A3050;margin:0 4px;}

    @page chart-landscape{ size:A4 landscape; margin:1cm; }
    @media print{
      body.tab-chart .chart-view-toggle,
      body.tab-chart .last-action-toast{ display:none!important; }
      body.tab-chart .perio-chart{ page:chart-landscape; min-width:0; }
      body.tab-chart .perio-chart-wrap{ overflow:visible!important; background:#fff!important;
        border:none!important; }
      body.tab-chart{ background:#fff!important; color:#000!important; }
      body.tab-chart .row-overlay .pd-line{ stroke:#1E40AF; opacity:1; }
      body.tab-chart .row-overlay .gm-line{ stroke:#9A3412; opacity:1; }
      /* Phase 5 — keep PD severity heatmap on paper. The global print rule
         strips backgrounds; these overrides restore the clinical wash so a
         printed chart still reads as a map. */
      body.tab-chart .site-cell.pd-mid{ background:#FEF3C7!important; }
      body.tab-chart .site-cell.pd-high{ background:#FECACA!important;
        box-shadow:inset 2px 0 0 #B91C1C!important; }
    }

    /* Phase 5 — touch-friendly site cells / dots / tooth-action buttons.
       Pointer-coarse covers iPad and phones; cells widen to 30px, inputs
       grow to 26px, and the BOP/SUP/Plaque dots get a 14px hit ring while
       the visual dot stays small. */
    @media (pointer:coarse){
      .site-cell{width:30px;}
      .site-cell input{height:26px;font-size:.78rem;}
      .site-dot{width:8px;height:8px;position:relative;}
      .site-dot::after{content:'';position:absolute;inset:-6px;border-radius:50%;}
      .tooth-actions button{padding:6px 10px;font-size:.72rem;}
      .tooth-crown{padding:5px 4px;}
      .row-overlay{display:none;}
    }
    .tooth-actions button:focus-visible{outline:2px solid #2DD4BF;outline-offset:1px;}

    /* Phase 5 — bidi isolate utility for elements that mix Hebrew prose with
       LTR clinical tokens (PD, GM, BOP, ←→). `unicode-bidi:plaintext` lets
       each run pick its own direction so punctuation stops drifting around
       the strongest token in the line. */
    .bidi-isolate{unicode-bidi:plaintext;}

    .print-only{display:none;}

    @media (max-width:900px){
      .idra-grid{grid-template-columns:1fr!important;}
    }

    /* Tab-bar — fade-edge so users notice horizontal overflow on phones */
    .tab-bar-wrap{position:relative;}
    .tab-bar-wrap::after{
      content:'';position:absolute;top:0;bottom:0;
      inset-inline-end:0;width:24px;pointer-events:none;
      background:linear-gradient(to left,#060D14,transparent);
    }
    [dir="rtl"] .tab-bar-wrap::after{background:linear-gradient(to right,#060D14,transparent);}

    /* Records grid: collapse to 1-col below tablet so Hebrew labels don't choke at 150px */
    @media (max-width:780px){
      .records-grid{grid-template-columns:1fr!important;}
    }

    /* ───── Mobile / smartphone layout (≤640px) ───── */
    @media (max-width:640px){
      .card{padding:14px!important;border-radius:12px!important;}
      .card-title{font-size:.62rem;margin-bottom:10px;}
      .field-input{font-size:.92rem;padding:9px 11px;}
      .tab-btn{padding:11px 14px!important;font-size:.78rem!important;}
      textarea.field-input{min-height:240px;font-size:.86rem;line-height:1.65;}
      .reasoning-row{padding:8px 0;}
      .nav-subtitle{display:none!important;}
      .records-grid{grid-template-columns:1fr!important;}
      /* Stage / Grade / Status badges shrink on phones */
      .badge-sg{font-size:1.55rem!important;padding:10px 18px!important;min-width:78px!important;}
      .badge-ext, .badge-status{padding:10px 14px!important;min-width:80px!important;}
      .badge-ext > div:last-child, .badge-status > div:last-child{font-size:.86rem!important;}
      .diag-line{font-size:.84rem!important;padding:11px 13px!important;line-height:1.55;}
      .diag-line span{display:block;margin:4px 0 0!important;}
      .tab-content{padding:14px 12px!important;}
      .navbar-root{padding:0 12px!important;gap:8px!important;}
      /* References cards: button below text on phones */
      .refs-card{flex-direction:column;align-items:stretch!important;}
      .refs-card a{align-self:flex-start;}
    }
    @media (max-width:380px){
      .badge-sg{font-size:1.3rem!important;padding:8px 13px!important;min-width:62px!important;}
      .tab-btn{padding:10px 11px!important;font-size:.74rem!important;}
    }

    @media print{
      *,*::before,*::after{
        background:transparent!important;color:#000!important;
        box-shadow:none!important;text-shadow:none!important;
        -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
      }
      .no-print,textarea.field-input{display:none!important;}
      .print-only{display:block!important;}
      html,body{background:#fff!important;}
      .card{background:#fff!important;border:1px solid #cbd5e1!important;page-break-inside:avoid;border-radius:6px!important;padding:14px!important;margin-bottom:10px!important;}
      .card-title{color:#334155!important;border-bottom:1px solid #cbd5e1;padding-bottom:4px;margin-bottom:8px;font-size:9pt!important;}
      .reasoning-row{border-bottom:1px solid #e2e8f0!important;}
      .print-letter{
        font-family:'Heebo',Arial,sans-serif;
        font-size:11pt;line-height:1.65;
        white-space:pre-wrap;word-break:break-word;
        padding:0;margin:0;color:#000;
      }
      .print-header{
        border-bottom:2px solid #1A3050;padding-bottom:6mm;margin-bottom:8mm;
        font-family:'Heebo',Arial,sans-serif;
      }
      .print-header h1{font-size:16pt;font-weight:800;margin:0 0 2mm;}
      .print-header .meta{font-size:10pt;color:#475569!important;}
      .field-input{border:1px solid #cbd5e1!important;background:#fff!important;color:#000!important;}
      @page{margin:18mm;size:A4;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

/* ─── BILINGUAL STRINGS ───────────────────────────────────────────────── */
const S = {
  he: {
    appSub:'כלי תמיכה קלינית פריו-אימפלנט',
    tabInput:'טופס קליני', tabImaging:'הדמיה', tabChart:'תרשים פריו', tabDx:'אבחנה', tabIDRA:'IDRA', tabOut:'פלט מקצועי',
    imgTitle:'ניתוח רדיוגרפי', imgSubtitle:'טען צילום פנורמי / פריאפיקלי / נשיכה (JPEG / PNG). מוצע בלבד — נדרש אישור קליני.',
    imgUpload:'גרור תמונה לכאן או לחץ לבחירה', imgUploadHint:'JPEG · PNG · עד 8MB',
    imgChange:'החלף תמונה', imgRemove:'הסר',
    imgPlaceholder:'אין תמונה טעונה',
    imgFileTooLarge:'הקובץ גדול מדי (מקסימום 8MB)',
    imgInvalidType:'סוג קובץ לא נתמך — בחר JPEG או PNG',
    imgFileName:'קובץ', imgDimensions:'מידות', imgFileSize:'גודל',
    imgMode:'מצב ניתוח', imgOffline:'מקומי (ללא רשת)', imgCloud:'ענן (Claude Vision)',
    imgCloudComingSoon:'מצב ענן יתווסף בשלב 7C',
    imgCloudConsentTitle:'הצהרת הסכמה — מצב ענן',
    imgCloudConsentBody:'התמונה תישלח לשרתי Anthropic — חברה אמריקאית, שרתים בארה״ב — לצורך ניתוח על-ידי מודל Claude Vision.\n\nעל פי תנאי השירות של Anthropic, התמונות עשויות להישמר עד 30 ימים לצורך בדיקת שימוש לרעה.\n\nהכלי הזה אינו מוגדר כ-HIPAA Business Associate ואינו מאושר להעברה של מידע בריאות מוגן (PHI).\n\nלפני שליחה — יש להסיר או לטשטש מהקובץ כל פרט מזהה של המטופל: שם, תעודת זהות, תאריך לידה, מספר תיק, ומטא-דאטה של DICOM.\n\nההסכמה תקפה לתמונה הספציפית הזו בלבד.',
    imgCloudConsentCheck:'אני מאשר/ת שקראתי את ההצהרה לעיל, שהתמונה הזו אינה מכילה פרטי מטופל מזהים, ושאני מבין/ה שהכלי אינו BAA לפי HIPAA',
    imgAnalyzeCloud:'נתח (ענן)', imgAnalyzeCloudFor:'שלח לניתוח ענן',
    imgCloudErrNotConfigured:'מפתח API של Anthropic לא מוגדר בשרת — פנה למנהל המערכת',
    imgCloudErrTooLarge:'התמונה גדולה מדי לשליחה — נסה תמונה קטנה יותר',

/* ─── CORE ALGORITHMS ────────────────────────────────────────────────────── */
function toRoman(n){ return ['','I','II','III','IV'][n]||'?'; }

function computeDiagnosis({ calWorst,rblPercent,maxPD,vbl,furcation,mobility,
    teethLost,teethAffected,mastDys,smokingCigs,packYears,hba1c,age }){
  const cal = parseFloat(calWorst), rbl = parseFloat(rblPercent);
  if(isNaN(cal)||isNaN(rbl)) return null;
  const pd = parseFloat(maxPD), vblV = parseFloat(vbl);
  const steps = [];

  // Stage from CAL
  let stageCAL = cal<2?1:cal<=4?2:3;
  steps.push({ key:'rCAL', val:`${cal}mm → Stage ${toRoman(stageCAL)}` });

  // Stage from RBL
  let stageRBL = rbl<15?1:rbl<=33?2:3;
  steps.push({ key:'rRBL', val:`${rbl}% → Stage ${toRoman(stageRBL)}` });

  // Base
  let stage = Math.max(stageCAL,stageRBL);
  steps.push({ key:'rBase', val:`Stage ${toRoman(stage)}` });

  // Complexity upgrades
  const cx=[];
  if(!isNaN(pd)&&pd>=6&&stage<3){ stage=3; cx.push(`PD ${pd}mm ≥6mm → III`); }
  if(!isNaN(vblV)&&vblV>=3&&stage<3){ stage=3; cx.push(`VBL ${vblV}mm ≥3mm → III`); }
  if(furcation==='2'&&stage<3){ stage=3; cx.push('Furcation II → III'); }
  if(furcation==='3'&&stage<4){ stage=4; cx.push('Furcation III → IV'); }
  if(parseInt(mobility)>=2&&stage<4){ stage=4; cx.push(`Mobility ${mobility} → IV`); }
  if(mastDys&&stage<4){ stage=4; cx.push('Masticatory dysfunction → IV'); }
  const tl=parseInt(teethLost)||0;
  if(tl>=5&&stage<4){ stage=4; cx.push(`${tl} teeth lost → IV`); }
  else if(tl>=1&&tl<=4&&stage<3){ stage=3; cx.push(`${tl} teeth lost → III`); }
  if(cx.length) steps.push({ key:'rComplex', val:cx.join(' | ') });
  steps.push({ key:'rFinalStage', val:`Stage ${toRoman(stage)}`, hl:true });

  // Stage IV subclassification (Herrera et al. 2022, J Clin Periodontol — PMID 35569036)
  let stageIVSubtype=null;
  if(stage===4){
    if(mastDys) stageIVSubtype='IVC';
    else if(parseInt(mobility)>=2) stageIVSubtype='IVB';
    else stageIVSubtype='IVA';
  }

  // Grade
  let grade='B', gradeScore=null;
  if(age&&age>0){
    gradeScore=rbl/age;
    grade=gradeScore<0.25?'A':gradeScore<=1.0?'B':'C';
    steps.push({ key:'rGScore', val:`${rbl}/${age} = ${gradeScore.toFixed(3)} → Grade ${grade}` });
  } else {
    steps.push({ key:'rGScore', val:'Age unknown — Grade B (default)' });
  }

  const mods=[];
  const cigs=parseInt(smokingCigs)||0;
  const py=parseFloat(packYears)||0;
  const hval=parseFloat(hba1c);
  // Pack-years (Leite 2018, PMID 29728276): ≥20 py → C; ≥10 py → B floor
  if(py>=20&&grade!=='C'){ grade='C'; mods.push(`Pack-years ${py} ≥20 → C`); }
  else if(py>=10&&py<20&&grade==='A'){ grade='B'; mods.push(`Pack-years ${py} ≥10 → B`); }
  // Cig/day (Tonetti 2018): ≥10 → C
  if(cigs>=10&&grade!=='C'){ grade='C'; mods.push(`Smoking ${cigs} cig/day ≥10 → C`); }
  // HbA1c stratified (Graziani 2018, PMID 29280184): 7.0–7.9% → B floor; ≥8.0% → C
  if(!isNaN(hval)&&hval>=8.0&&grade!=='C'){ grade='C'; mods.push(`HbA1c ${hval}% ≥8.0% → C`); }
  else if(!isNaN(hval)&&hval>=7.0&&hval<8.0&&grade==='A'){ grade='B'; mods.push(`HbA1c ${hval}% 7.0–7.9% → B`); }
  if(mods.length) steps.push({ key:'rGMod', val:mods.join(' | ') });
  steps.push({ key:'rFinalGrade', val:`Grade ${grade}`, hl:true });

  const pct=parseFloat(teethAffected);
  const extent=isNaN(pct)?'undef':pct<30?'localized':'generalized';
  steps.push({ key:'rExtent', val:extent });

  return { stage:toRoman(stage), stageN:stage, grade, extent, gradeScore, steps, stageIVSubtype };
}

function computeIDRARisk(scores){
  const any3=scores.some(s=>s===3), c2=scores.filter(s=>s===2).length;
  if(!any3&&scores.every(s=>s===1)) return 'LOW';
  if(any3||c2>=3) return 'HIGH';
  return 'MODERATE';
}

/* ─── PERIODONTAL CHART HELPERS ──────────────────────────────────────────── */
const FDI_MAXILLA = ['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'];
const FDI_MANDIBLE = ['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38'];
const SITE_KEYS = ['mb','b','db','ml','l','dl'];
const BUCCAL_KEYS = ['mb','b','db'];
const LINGUAL_KEYS = ['ml','l','dl'];

function blankSite(){ return {pd:null, gm:null, bop:false, sup:false, plaque:false}; }
function blankTooth(){
  return {missing:false, implant:false, mobility:0, furcation:0, prognosis:'',
    sites:{mb:blankSite(),b:blankSite(),db:blankSite(),ml:blankSite(),l:blankSite(),dl:blankSite()}};
}
function createBlankChart(){
  const c={};
  for(const fdi of [...FDI_MAXILLA, ...FDI_MANDIBLE]) c[fdi]=blankTooth();
  return c;
}

/* Demo chart for the "Load Demo Case" button — generalized severe periodontitis,
   matches Yossi Cohen's narrative. Posterior teeth deeper, anterior shallower. */
function loadDemoChart(){
  const c=createBlankChart();
  /* 4 first molars missing (common in advanced perio) */
  for(const f of ['16','26','36','46']) c[f].missing=true;
  /* Tooth-level findings */
  c['17'].furcation=3;  c['27'].furcation=2;  c['47'].furcation=2;
  c['37'].mobility=2;   c['11'].mobility=1;
  c['12'].implant=true; /* anterior implant — explains "Active implant" demo line */
  /* Site templates (PD, GM, BOP, SUP, plaque) for posterior vs anterior */
  const post=[
    {pd:6,gm:1,bop:true,sup:false,plaque:true},
    {pd:5,gm:1,bop:true,sup:false,plaque:false},
    {pd:7,gm:1,bop:true,sup:true, plaque:true},
    {pd:4,gm:0,bop:true,sup:false,plaque:true},
    {pd:5,gm:1,bop:false,sup:false,plaque:false},
    {pd:6,gm:0,bop:true,sup:false,plaque:true},
  ];
  const ant=[
    {pd:4,gm:0,bop:true,sup:false,plaque:false},
    {pd:3,gm:0,bop:false,sup:false,plaque:true},
    {pd:5,gm:1,bop:true,sup:false,plaque:true},
    {pd:3,gm:0,bop:true,sup:false,plaque:false},
    {pd:4,gm:0,bop:false,sup:false,plaque:true},
    {pd:4,gm:1,bop:true,sup:false,plaque:false},
  ];
  const isPosterior = (fdi) => ['7','6','5','4'].includes(fdi[1]);
  for(const fdi of [...FDI_MAXILLA,...FDI_MANDIBLE]){
    if(c[fdi].missing) continue;
    const tmpl = isPosterior(fdi) ? post : ant;
    for(let i=0;i<SITE_KEYS.length;i++) c[fdi].sites[SITE_KEYS[i]]={...tmpl[i]};
  }
  /* Worst-site outliers — drives maxPD=8, worstCAL=7 */
  c['17'].sites.mb={pd:8,gm:1,bop:true,sup:true,plaque:true};
  c['27'].sites.db={pd:7,gm:0,bop:true,sup:true,plaque:false};
  return c;
}
/* Aggregate the chart into the summary stats the staging engine + IDRA need.
   - calWorst:     max(pd + gm) across measured sites; CAL is derived per-site (never stored)
   - maxPD:        max pd across measured sites
   - bopPercent:   100 × bop_sites / measured_sites  (alias: fmbs)
   - fmps:         100 × plaque_sites / measured_sites
   - teethAffected:100 × (teeth with any CAL ≥1mm site) / present_teeth
   - pdSitesScore: IDRA vector — 1 if 0 sites ≥5mm, 2 if 1–4, 3 if ≥5
   - presentTeeth: count of non-missing teeth (used to decide if chart is "filled enough") */
function computeChartDerived(chart){
  let measured=0, bopCount=0, plaqueCount=0, sites5plus=0;
  let maxPD=0, worstCAL=0, furcMax=0, mobMax=0;
  let presentTeeth=0, affectedTeeth=0;
  for(const fdi of Object.keys(chart)){
    const tooth=chart[fdi];
    if(tooth.missing) continue;
    presentTeeth++;
    if(tooth.furcation>furcMax) furcMax=tooth.furcation;
    if(tooth.mobility>mobMax)   mobMax=tooth.mobility;
    let toothAffected=false;
    for(const k of SITE_KEYS){
      const s=tooth.sites[k];
      if(s.pd!=null){
        measured++;
        if(s.pd>maxPD) maxPD=s.pd;
        if(s.pd>=5)    sites5plus++;
        const cal=(s.pd??0)+(s.gm??0);
        if(cal>worstCAL) worstCAL=cal;
        if(cal>=1) toothAffected=true;
      }
      if(s.bop)    bopCount++;
      if(s.plaque) plaqueCount++;
    }
    if(toothAffected) affectedTeeth++;
  }
  const pct=(n)=>measured?Math.round((n/measured)*100):0;
  return {
    measured, presentTeeth,
    fmbs:pct(bopCount), fmps:pct(plaqueCount),
    bopPercent:pct(bopCount),
    maxPD, calWorst:worstCAL,
    teethAffected:presentTeeth?Math.round((affectedTeeth/presentTeeth)*100):0,
    furcationMax:furcMax, mobilityMax:mobMax,
    pdSitesScore: sites5plus===0?1:sites5plus<=4?2:3,
    sites5plus,
  };
}

/* ─── RADIOGRAPHIC IMAGE AI (Phase 7B) ────────────────────────────────────
   Hybrid offline + opt-in cloud architecture. This phase implements the
   offline path: ONNX Runtime Web loads a quantized YOLOv8 finetune from
   vendor/models/perio-rbl.onnx, runs WebGPU/WASM inference on the canvas,
   and returns per-tooth %RBL by measuring (CEJ–ABC)/(CEJ–apex). VBL is
   derived from the largest single-tooth deviation from the median.
   Citations: Krois et al. 2019 (PMID 31186466) — CNN bone-loss detection;
   Schwendicke et al. 2020 (PMID 32092430) — DL-radiographic concordance. */

const IMG_RUNTIME_PATH = 'vendor/onnxruntime-web/ort.min.js';
const IMG_MODEL_PATH   = 'vendor/models/perio-rbl.onnx';
const IMG_INPUT_SIZE   = 640;

let _ortLoadPromise = null;
function loadOnnxRuntime(){
  /* Lazy-load ort.min.js exactly once. Resolves with the global `ort` object
     or rejects with a stable code so the UI can show imgRuntimeMissing. */
  if(_ortLoadPromise) return _ortLoadPromise;
  _ortLoadPromise = new Promise((resolve, reject) => {
    if(typeof window !== 'undefined' && window.ort){ resolve(window.ort); return; }
    const s = document.createElement('script');
    s.src = IMG_RUNTIME_PATH;
    s.async = true;
    s.onload = () => window.ort ? resolve(window.ort) : reject(new Error('RUNTIME_MISSING'));
    s.onerror = () => reject(new Error('RUNTIME_MISSING'));
    document.head.appendChild(s);
  });
  return _ortLoadPromise;
}

let _modelSession = null;
async function getOnnxSession(){
  if(_modelSession) return _modelSession;
  const ort = await loadOnnxRuntime();
  try {
    _modelSession = await ort.InferenceSession.create(IMG_MODEL_PATH, {
      executionProviders: ['webgpu', 'wasm'],
      graphOptimizationLevel: 'all',
    });
    return _modelSession;
  } catch(e){
    throw new Error('MODEL_MISSING');
  }
}

function canvasToTensor(canvas, size, ort){
  /* Letterboxed resize → CHW Float32Array normalized [0,1]. Mirrors YOLOv8's
     standard preprocessing. The off-screen scratch canvas sized exactly
     `size`×`size` keeps coordinate transforms simple. */
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const scale = Math.min(size / canvas.width, size / canvas.height);
  const dw = Math.round(canvas.width * scale);
  const dh = Math.round(canvas.height * scale);
  const dx = Math.floor((size - dw) / 2);
  const dy = Math.floor((size - dh) / 2);
  octx.fillStyle = '#000';
  octx.fillRect(0, 0, size, size);
  octx.drawImage(canvas, dx, dy, dw, dh);
  const { data } = octx.getImageData(0, 0, size, size);
  const f = new Float32Array(3 * size * size);
  const ch = size * size;
  for(let i = 0, p = 0; i < data.length; i += 4, p++){
    f[p]        = data[i]   / 255;
    f[ch + p]   = data[i+1] / 255;
    f[2*ch + p] = data[i+2] / 255;
  }
  return new ort.Tensor('float32', f, [1, 3, size, size]);
}

async function runOnnxInference(canvas){
  /* v2: Returns { rblBucket, confidence, source:'onnx' } or throws an Error
     with message 'RUNTIME_MISSING' | 'MODEL_MISSING' | 'INFERENCE_FAILED'.
     The function is currently unreachable in production — postprocessOnnxOutput
     is a `[]` stub until a real .onnx ships. When it does, this function
     converts the model's mm/% output to an AAP-keyed bucket; the clinician
     enters mm/% themselves either way. */
  const ort = await loadOnnxRuntime();
  const session = await getOnnxSession();
  const tensor = canvasToTensor(canvas, IMG_INPUT_SIZE, ort);
  const inputName = session.inputNames[0];
  let output;
  try {
    const feeds = {}; feeds[inputName] = tensor;
    output = await session.run(feeds);
  } catch(e){
    throw new Error('INFERENCE_FAILED');
  }
  /* Postprocessing: the finetuned model is expected to emit per-tooth landmark
     boxes (CEJ, ABC, apex). For each detection above threshold, %RBL =
     (ABC.y − CEJ.y) / (apex.y − CEJ.y) × 100. Median across teeth = overall
     RBL%; max = worst-site. VBL = max − median (mm, scaled by tooth height
     heuristic). The exact head shape is model-specific so we keep this
     postprocessor a single named function — swap it when the real model
     ships and tighten the schema then. */
  const tooth = postprocessOnnxOutput(output);
  if(!tooth || !tooth.length) throw new Error('INFERENCE_FAILED');
  const rbls = tooth.map(t => t.rbl).filter(v => v != null && !isNaN(v)).sort((a,b)=>a-b);
  if(!rbls.length) throw new Error('INFERENCE_FAILED');
  const median = rbls.length % 2 ? rbls[(rbls.length-1)/2] : (rbls[rbls.length/2-1]+rbls[rbls.length/2])/2;
  const meanConf = tooth.reduce((s,t)=>s+(t.conf||0),0)/tooth.length;
  /* AAP/EFP 2018 stage cutoffs: <15% → I, 15-33% → II, >33% → III/IV. */
  const bucket = median < 1 ? 'none' : median < 15 ? 'mild' : median <= 33 ? 'moderate' : 'severe';
  return {
    rblBucket: bucket,
    confidence: meanConf >= 0.7 ? 'high' : meanConf >= 0.5 ? 'med' : 'low',
    source: 'onnx',
  };
}

function postprocessOnnxOutput(_output){
  /* Placeholder: the real postprocessor depends on the finetuned model's
     output head (YOLOv8 detection vs. keypoint vs. segmentation). When the
     .onnx file ships, replace this body with NMS + landmark grouping +
     CEJ/ABC/apex assignment per tooth. Returning [] forces INFERENCE_FAILED
     so the UI shows imgAnalysisFailed instead of fabricated numbers. */
  return [];
}

async function postToVisionAPI({canvas, lang}){
  /* Phase 7C — cloud opt-in. Re-encodes the canvas to JPEG with a max edge
     of 1280px (typical Claude Vision sweet spot, also keeps body under
     Vercel's edge body limit) and POSTs to /api/vision. Returns the same
     shape as runOnnxInference plus optional caries/periapical/calculus/notes
     arrays. Throws Error with a stable code so the UI can map to a specific
     bilingual message. */
  const maxEdge = 1280;
  const scale = Math.min(1, maxEdge / Math.max(canvas.width, canvas.height));
  const dw = Math.round(canvas.width * scale);
  const dh = Math.round(canvas.height * scale);
  const off = document.createElement('canvas');
  off.width = dw; off.height = dh;
  const ctx = off.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, dw, dh);
  ctx.drawImage(canvas, 0, 0, dw, dh);
  const dataUrl = off.toDataURL('image/jpeg', 0.85);
  const imageBase64 = dataUrl.split(',')[1] || '';
  if(!imageBase64) throw new Error('IMAGE_ENCODE_FAILED');

  let resp;
  try {
    resp = await fetch('/api/vision', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ imageBase64, mediaType:'image/jpeg', lang }),
    });
  } catch(e){
    throw new Error('UPSTREAM_UNREACHABLE');
  }

  let json;
  try { json = await resp.json(); }
  catch { throw new Error('UNPARSEABLE'); }

  if(!resp.ok){
    if(resp.status === 503 || json?.error === 'not_configured') throw new Error('NOT_CONFIGURED');
    if(resp.status === 413 || json?.error === 'image_too_large') throw new Error('TOO_LARGE');
    if(resp.status === 403 || json?.error === 'forbidden_origin') throw new Error('FORBIDDEN');
    if(resp.status === 429 || json?.error === 'rate_limited') throw new Error('RATE_LIMITED');
    if(json?.error === 'bad_image_bytes' || json?.error === 'bad_media_type') throw new Error('BAD_IMAGE');
    if(resp.status === 502 && json?.error === 'unparseable') throw new Error('UNPARSEABLE');
    throw new Error('UPSTREAM_ERROR');
  }

  const ALLOWED_BUCKETS = ['none','mild','moderate','severe'];
  return {
    rblBucket: ALLOWED_BUCKETS.includes(json.rblBucket) ? json.rblBucket : null,
    confidence: ['low','med','high'].includes(json.confidence) ? json.confidence : 'low',
    source: 'cloud',
    caries:     Array.isArray(json.caries)     ? json.caries     : [],
    periapical: Array.isArray(json.periapical) ? json.periapical : [],
    calculus:   Array.isArray(json.calculus)   ? json.calculus   : [],
    notes: typeof json.notes === 'string' ? json.notes : '',
  };
}

  /* Deterministic mock — used so the rest of the pipeline (Findings panel,

  return {

  };

function computeImagingDerived(result){
  /* Pure aggregator. v2: AI never produces calibrated mm/% — the clinician
     enters those by reading the radiograph themselves. We surface a
     categorical bucket (AAP/EFP 2018-keyed) plus qualitative flags. The
     engine's rblPercent / vbl come from manual entry or the chart, never
     from imaging. */
  if(!result) return null;
  const ALLOWED = ['none','mild','moderate','severe'];
  const isCloud = result.source === 'cloud';
  return {
    rblBucket:   ALLOWED.includes(result.rblBucket) ? result.rblBucket : null,
    confidence:  result.confidence || 'low',
    source:      result.source || 'unknown',
    isDemo:      result.source === 'demo',
    isCloud,
    caries:     isCloud && Array.isArray(result.caries)     ? result.caries     : [],
    periapical: isCloud && Array.isArray(result.periapical) ? result.periapical : [],
    calculus:   isCloud && Array.isArray(result.calculus)   ? result.calculus   : [],
    notes:      isCloud && typeof result.notes === 'string' ? result.notes      : '',
  };
}

/* Peri-implant case definitions updated to EFP 2023 S3 CPG (Herrera et al. — PMID 37305797).
   Peri-implantitis: BOP/SUP + (BL ≥3mm [no baseline] OR BL ≥2mm [baseline] OR PD ≥6mm).
   Berglundh 2018 (PMID 29926948) defines the health/mucositis boundary. */
function computePeriImplantDx({hasImplants, bopSup, bl, hasBaseline, piPD}){
  if(!hasImplants) return null;
  if(!bopSup) return 'health';
  const blN = parseFloat(bl);
  const pdN = parseFloat(piPD);
  if(isNaN(blN) || blN <= 0) return 'mucositis';
  const thresh = hasBaseline ? 2 : 3;
  const blMet = blN >= thresh;
  const pdMet = !isNaN(pdN) && pdN >= 6;
  return (blMet || pdMet) ? 'periimplantitis' : 'mucositis';
}

/* SPT interval titrated to IDRA risk (Heitz-Mayfield et al. 2020, Periodontol 2000 — PMID 32780477). */
function sptIntervalKey(risk){
  return risk==='HIGH' ? 'sptHigh' : risk==='LOW' ? 'sptLow' : 'sptMod';
}

/* Periodontal Risk Assessment — SPT recall (Lang & Tonetti 2003, PMID 15643744).
   6 vectors, each scored 1 (low) / 2 (mod) / 3 (high). Recall: 0–1 high → 12mo; 2 high → 6mo; ≥3 high → 3mo. */
function praRecall({bopPct, sites5plus, teethLost, blAge, smokingCigs, packYears, hba1c}){
  const cigs=parseInt(smokingCigs)||0;
  const py=parseFloat(packYears)||0;
  const hval=parseFloat(hba1c);
  const tl=parseInt(teethLost)||0;
  const bop=parseFloat(bopPct);
  const bopS = isNaN(bop)?1 : bop<=10?1 : bop<=30?2 : 3;
  const s5=parseInt(sites5plus)||0;
  const s5S  = s5<=3?1 : s5<=7?2 : 3;
  const tlS  = tl<=4?1 : tl<=8?2 : 3;
  const ba=parseFloat(blAge);
  const baS  = isNaN(ba)?1 : ba<=0.5?1 : ba<=1.0?2 : 3;
  const sysS = (!isNaN(hval)&&hval>=8.0)?3 : (!isNaN(hval)&&hval>=7.0)?2 : 1;
  const smkS = (py>=20||cigs>=20)?3 : (py>=10||cigs>=10)?2 : 1;
  const scores=[bopS,s5S,tlS,baS,sysS,smkS];
  const highN=scores.filter(s=>s===3).length;
  const recallEn=highN>=3?'every 3 months':highN>=2?'every 6 months':'every 12 months';
  const recallHe=highN>=3?'כל 3 חודשים':highN>=2?'כל 6 חודשים':'כל 12 חודשים';
  const FACTORS=['BOP %','Sites ≥5mm','Teeth lost','BL/Age','Systemic','Smoking'];
  return {scores,highN,recallEn,recallHe,FACTORS};
}

/* Israeli National ID — 9 digits, mod-10 checksum (Luhn-like, alternating ×1/×2, sum digits if >9). */
function validIsraeliID(id){
  if(!/^\d{9}$/.test(id||'')) return false;
  let sum=0;
  for(let i=0;i<9;i++){
    let d=parseInt(id[i],10)*((i%2===0)?1:2);
    if(d>9) d=Math.floor(d/10)+(d%10);
    sum+=d;
  }
  return sum%10===0;
}

/* Auto case-type triage (Tonetti/Greenwell/Kornman 2018, J Periodontol — PMID 29926952).
   Periodontitis case definition: interdental CAL ≥1 mm at ≥2 non-adjacent teeth. */
function autoCaseType({calWorst, bopPercent}){
  const cal=parseFloat(calWorst), bop=parseFloat(bopPercent);
  if((isNaN(cal)||cal===0) && (isNaN(bop)||bop<10)) return 'health';
  if((isNaN(cal)||cal===0) && bop>=10) return 'gingivitis';
  return 'periodontitis';
}

/* Treatment-status auto-detect (Chapple 2018, J Periodontol — PMID 29926944).
   Stable: BOP <10%, max PD ≤4 mm, no BOP at 4-mm sites, no sites ≥5 mm.
   Remission: BOP <10%, residual PD ≥5 mm but no BOP.
   Unstable: PD ≥6 mm, OR PD ≥5 mm with BOP. */
function autoTxStatus({maxPD, bopPercent}){
  const pd=parseFloat(maxPD), bop=parseFloat(bopPercent);
  if(isNaN(pd)||isNaN(bop)) return 'untreated';
  if(pd>=6) return 'unstable';
  if(pd>=5 && bop>=10) return 'unstable';
  if(pd>=5 && bop<10) return 'remission';
  if(pd<=4 && bop<10) return 'stable';
  return 'untreated';
}

/* ICD-10 mapping for AAP/EFP 2018 case types & stages. */
function icd10For({caseType, stage}){
  if(caseType==='health') return 'Z01.20';
  if(caseType==='gingivitis') return 'K05.10';
  if(caseType==='npd') return 'A69.1';
  if(caseType==='endoPerio') return 'K04.7';
  if(caseType==='periodontitis'){
    if(stage==='I') return 'K05.31';
    if(stage==='II') return 'K05.32';
    if(stage==='III'||stage==='IV') return 'K05.33';
    return 'K05.30';
  }
  return 'K05.6';
}

/* EFP S3 Stepwise Treatment (Sanz, Herrera et al. 2020, J Clin Periodontol — DOI 10.1111/jcpe.13290; PMID 32383274).
   Stage IV: Herrera, Sanz, Kebschull et al. 2022 — DOI 10.1111/jcpe.13639. */
function s3Steps({lang, stage, grade, extent, sptHe, sptEn}){
  const he = lang==='he';
  const adjAB = (grade==='C' && extent==='generalized');
  const lines = [];
  lines.push(he?'• שלב 1 — שינוי התנהגותי, OHI, הסרת רובד על-חניכי, הנחיית חדילה מעישון':
                 '• Step 1 — Behavioural change, OHI, supragingival biofilm/calculus removal, smoking-cessation counselling');
  lines.push(he?'• שלב 2 — אינסטרומנטציה תת-חניכית (SRP); הערכה מחדש לאחר 8–12 שבועות':
                 '• Step 2 — Subgingival instrumentation (SRP); re-evaluation at 8–12 weeks');
  if(adjAB) lines.push(he?'   ↳ שיקול תוספת אנטיביוטיקה סיסטמית (Stage III גנרליזד, Grade C, מטופל צעיר)':
                            '   ↳ Consider adjunctive systemic antibiotics (Stage III generalized, Grade C, young patient)');
  if(stage==='III'||stage==='IV') lines.push(he?'• שלב 3 — ניתוח פריודונטלי לכיסים שיוריים ≥6 מ"מ (resective/regenerative)':
                                                  '• Step 3 — Periodontal surgery for residual pockets ≥6 mm (resective/regenerative)');
  if(stage==='IV') lines.push(he?'• ניהול רב-תחומי — אורתודונטיה, פרוסטודונטיה, סד-לעיסה לפי הצורך (CPG Stage IV — Herrera 2022)':
                                  '• Multidisciplinary management — orthodontic, prosthodontic, occlusal splint as indicated (Stage IV CPG, Herrera 2022)');
  lines.push(he?`• שלב 4 — תחזוקה (SPT) ${sptHe} מבוסס IDRA`:
                 `• Step 4 — Supportive Periodontal Therapy (SPT) ${sptEn} (IDRA-based)`);
  return lines.join('\n');
}

/* ─── OCTAGON SVG HELPERS ────────────────────────────────────────────────── */
const CX=230, CY=230;
const ZONE_R={1:62,2:114,3:166}, LABEL_R=200;

function axPt(i,r){
  const a=(i*45-90)*Math.PI/180;
  return {x:CX+r*Math.cos(a), y:CY+r*Math.sin(a)};
}
function pts(radii){ return radii.map((r,i)=>{ const p=axPt(i,r); return `${p.x},${p.y}`; }).join(' '); }
function zonePts(r){ return pts(AXES.map(()=>r)); }
function dataPts(scores){ return pts(scores.map(s=>ZONE_R[s]||ZONE_R[1])); }

function FLabel({ label, note, htmlFor }){
  return (
    <div style={{marginBottom:4}}>
      <label htmlFor={htmlFor} style={{fontSize:'.76rem',fontWeight:600,color:'#94A3B8'}}>{label}</label>
      {note&&<span style={{fontSize:'.66rem',color:'#F59E0B',marginRight:8,marginLeft:6}}>{note}</span>}
    </div>
  );
}
function FInput({ label,note,type='text',value,onChange,min,max,step,placeholder,inputMode,autoComplete,pattern,maxLength }){
  const id=React.useId();
  const noteId=note?`${id}-note`:undefined;
  /* Numeric fields default to 'decimal' so phones open the numeric keypad. */
  const im = inputMode || (type==='number' ? 'decimal' : undefined);
  return (
    <div style={{marginBottom:14}}>
      <FLabel label={label} note={note} htmlFor={id}/>
      <input id={id} className="field-input" type={type} value={value}
        onChange={e=>onChange(e.target.value)}
        min={min} max={max} step={step} placeholder={placeholder}
        inputMode={im} autoComplete={autoComplete} pattern={pattern} maxLength={maxLength}
        aria-describedby={noteId}/>
      {noteId&&<span id={noteId} style={{display:'none'}}>{note}</span>}
    </div>
  );
}
function FSelect({ label,note,value,onChange,opts }){
  const id=React.useId();
  return (
    <div style={{marginBottom:14}}>
      <FLabel label={label} note={note} htmlFor={id}/>
      <select id={id} className="field-input" value={value} onChange={e=>onChange(e.target.value)}>
        {opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
      </select>
    </div>
  );
}
function FCheck({ label,checked,onChange }){
  return (
    <div style={{marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}
        style={{width:16,height:16,accentColor:'#2DD4BF',cursor:'pointer',flexShrink:0}}/>
      <span style={{fontSize:'.84rem',color:'#94A3B8',cursor:'pointer'}} onClick={()=>onChange(!checked)}>{label}</span>
    </div>
  );
}
function Card({ title,children,style }){
  return (
    <div className="card" style={style}>
      {title&&<div className="card-title">{title}</div>}
      {children}
    </div>
  );
}

/* ─── OCTAGON SVG ─────────────────────────────────────────────────────────── */
function OctagonSVG({scores}){
  const V=460;
  return (
    <svg viewBox={`0 0 ${V} ${V}`} style={{width:'100%',maxWidth:520,display:'block'}}>
      <rect width={V} height={V} fill="#0C1A28" rx="12"/>
      {/* Zone fills */}
      <polygon points={zonePts(ZONE_R[3])} fill="#EF444418" stroke="#EF444438" strokeWidth="1"/>
      <polygon points={zonePts(ZONE_R[2])} fill="#F59E0B14" stroke="#F59E0B28" strokeWidth="1"/>
      <polygon points={zonePts(ZONE_R[1])} fill="#22C55E14" stroke="#22C55E2A" strokeWidth="1"/>
      {/* Axis lines */}
      {AXES.map((_,i)=>{ const e=axPt(i,ZONE_R[3]); return <line key={i} x1={CX} y1={CY} x2={e.x} y2={e.y} stroke="#1A3050" strokeWidth="1"/>; })}
      {/* Data polygon */}
      <polygon points={dataPts(scores)} fill="rgba(45,212,191,.16)" stroke="#2DD4BF" strokeWidth="2.2" strokeLinejoin="round"/>
      {/* Score dots */}
      {scores.map((s,i)=>{
        const p=axPt(i,ZONE_R[s]||ZONE_R[1]);
        const dc=s===1?'#22C55E':s===2?'#F59E0B':'#EF4444';
        return <circle key={i} cx={p.x} cy={p.y} r="6" fill={dc} stroke="#060D14" strokeWidth="1.5"/>;
      })}
      {/* Axis labels */}
      {AXES.map((ax,i)=>{
        const p=axPt(i,LABEL_R); const ls=ax.split('\n'); const lh=14;
        return (
          <text key={i} x={p.x} y={p.y-(ls.length-1)*lh/2} textAnchor="middle" fontSize="12" fill="#CBD5E1" fontFamily="Inter,sans-serif" fontWeight="500">
            {ls.map((l,j)=><tspan key={j} x={p.x} dy={j===0?0:lh}>{l}</tspan>)}
          </text>
        );
      })}
      {/* Center */}
      <circle cx={CX} cy={CY} r="4" fill="#2DD4BF" opacity=".55"/>
      {/* Zone labels inline */}
      <text x={CX+(ZONE_R[1]+ZONE_R[1]*.0)*.55} y={CY-4} textAnchor="middle" fontSize="10" fill="#22C55EAA" fontFamily="Inter" fontWeight="700" letterSpacing="1">LOW</text>
      <text x={CX+(ZONE_R[1]+ZONE_R[2])/2} y={CY-4} textAnchor="middle" fontSize="10" fill="#F59E0BAA" fontFamily="Inter" fontWeight="700" letterSpacing="1">MOD</text>
      <text x={CX+(ZONE_R[2]+ZONE_R[3])/2} y={CY-4} textAnchor="middle" fontSize="10" fill="#EF4444AA" fontFamily="Inter" fontWeight="700" letterSpacing="1">HIGH</text>
    </svg>
  );
}

    set('piBL','4');
    set('piPDC','3');
    set('piHasBaseline',true);
    /* Phase 2: also fill the periodontal chart so derivation matches the manual values
       (chart is now the source of truth when filled — manual fields become fallback). */
    if(setChart) setChart(loadDemoChart());
  };
  const loadDemo = () => {
    if(formHasData){

  const mobOpts=[{v:'0',l:t('m0')},{v:'1',l:t('m1')},{v:'2',l:t('m2')},{v:'3',l:t('m3')}];

  const clOpts=[{v:'1',l:t('cl1')},{v:'2',l:t('cl2')},{v:'3',l:t('cl3')}];

  return (

            <button onClick={()=>setDemoDismissed(true)} aria-label={t('demoDismiss')} style={{

              borderRadius:8,width:32,height:32,cursor:'pointer',fontSize:'1.1rem',

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,marginBottom:16}}>
        <Card title={t('secPt')}>
          <FInput label={t('ptName')} value={st.patientName} onChange={v=>set('patientName',v)} placeholder="—" autoComplete="name"/>

          <FSelect label={t('ptGender')} value={st.patientGender} onChange={v=>set('patientGender',v)} opts={gOpts}/>
        </Card>
        <Card title={t('secSys')}>
          <FInput label={t('smoking')} note={t('smokeNote')} type="number" min="0" max="80" value={st.smokingCigs} onChange={v=>set('smokingCigs',v)} placeholder="0"/>
          <FInput label={t('packYears')} note={t('packYearsNote')} type="number" min="0" max="200" step=".5" value={st.packYears} onChange={v=>set('packYears',v)} placeholder="0"/>
          <FInput label={t('hba1c')} note={t('hba1cNote')} type="number" min="4" max="15" step=".1" value={st.hba1c} onChange={v=>set('hba1c',v)} placeholder="—"/>

        </Card>
        <Card title={<span>{t('secRecords')}<span style={{fontSize:'.6rem',fontWeight:500,color:'#7B8AA4',marginInlineStart:8,letterSpacing:0,textTransform:'none'}}>· {t('secRecordsCite')}</span></span>}>
          <div className="records-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 12px'}}>
            <FInput label={t('residentName')} value={st.residentName} onChange={v=>set('residentName',v)} placeholder="—"/>
            <FInput label={t('licenseNo')} value={st.licenseNo} onChange={v=>set('licenseNo',v)} placeholder="—"/>
            <FInput label={t('attendingName')} value={st.attendingName} onChange={v=>set('attendingName',v)} placeholder="—"/>
            <FInput label={t('attendingLicense')} value={st.attendingLicense} onChange={v=>set('attendingLicense',v)} placeholder="—"/>

      <Card title={t('secPerio')} style={{marginBottom:16}}>

          /* Advisory pill — purely informational. v2 never auto-writes mm/%

              marginBottom:14,padding:'10px 14px',borderRadius:8,

              display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',
            }}>
              <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:4,
                background:'#082525',color:'#5EEAD4',letterSpacing:0.5}}>
                {imagingResult.source==='demo' ? t('imgDemoBadge') : t('imgAiSuggested')}
              </span>
              <span style={{fontSize:13,color:'#A5F0F0'}}>
                {t('imgPillBucketPrefix')}: <strong>{bucketLabel}</strong>
              </span>
              <span style={{fontSize:11,color:'#7B8AA4',fontStyle:'italic'}}>
                {t('imgPillReviewHint')}
              </span>
            </div>
          );
        })()}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:'12px 20px'}}>
          <FInput label={t('calWorst')} type="number" min="0" max="20" step=".5" value={st.calWorst} onChange={v=>set('calWorst',v)} placeholder="mm"/>
          <FInput label={t('rbl')} type="number" min="0" max="100" value={st.rblPercent} onChange={v=>set('rblPercent',v)} placeholder="%"/>
          <FInput label={t('maxPD')} type="number" min="0" max="20" step=".5" value={st.maxPD} onChange={v=>set('maxPD',v)} placeholder="mm"/>
          <FInput label={t('vbl')} type="number" min="0" max="20" step=".5" value={st.vbl} onChange={v=>set('vbl',v)} placeholder="mm"/>
          <FSelect label={t('furc')} value={st.furcation} onChange={v=>set('furcation',v)} opts={furcOpts}/>
          <FSelect label={t('mob')} value={st.mobility} onChange={v=>set('mobility',v)} opts={mobOpts}/>
          <FInput label={t('bop')} type="number" min="0" max="100" value={st.bopPercent} onChange={v=>set('bopPercent',v)} placeholder="%"/>
          <FInput label={t('tLost')} type="number" min="0" max="32" value={st.teethLost} onChange={v=>set('teethLost',v)} placeholder="0"/>
          <FInput label={t('tAffected')} type="number" min="0" max="100" value={st.teethAffected} onChange={v=>set('teethAffected',v)} placeholder="%"/>
          <div style={{paddingTop:22}}><FCheck label={t('mastDys')} checked={st.mastDys} onChange={v=>set('mastDys',v)}/></div>
        </div>
      </Card>

      <Card title={t('secIDRA')} style={{marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'12px 20px'}}>
          <FSelect label={t('histPerioL')} value={st.histPerio} onChange={v=>set('histPerio',v)} opts={hpOpts}/>
          <FSelect label={t('pdSitesL')} value={st.pdSites} onChange={v=>set('pdSites',v)} opts={pdOpts}/>
          <FInput label={t('blAgeL')} type="number" min="0" max="5" step=".01" value={st.blAgeRatio} onChange={v=>set('blAgeRatio',v)} placeholder="auto"/>
          <FSelect label={t('suspL')} value={st.suspClass} onChange={v=>set('suspClass',v)} opts={suspOpts}/>
          <FSelect label={t('sptL')} value={st.sptComp} onChange={v=>set('sptComp',v)} opts={sptOpts}/>
          <FSelect label={t('restL')} value={st.restMargin} onChange={v=>set('restMargin',v)} opts={rmOpts}/>
          <FSelect label={t('cleanL')} value={st.cleanability} onChange={v=>set('cleanability',v)} opts={clOpts}/>
        </div>
      </Card>

      <Card title={t('secPI')} style={{marginBottom:20}}>
        <FCheck label={t('piHas')} checked={st.hasImplants} onChange={v=>set('hasImplants',v)}/>
        {st.hasImplants && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'12px 20px',marginTop:12}}>
            <div style={{paddingTop:6}}><FCheck label={t('piBOPSup')} checked={st.piBOPSup} onChange={v=>set('piBOPSup',v)}/></div>
            <FInput label={t('piBL')} type="number" min="0" max="20" step=".5" value={st.piBL} onChange={v=>set('piBL',v)} placeholder="mm"/>
            <FInput label={t('piPDC')} type="number" min="0" max="20" step=".5" value={st.piPDC} onChange={v=>set('piPDC',v)} placeholder="mm"/>
            <FInput label={t('piPDL')} note={t('piPDNote')} type="number" min="0" max="20" step=".5" value={st.piPD} onChange={v=>set('piPD',v)} placeholder="mm"/>
            <div style={{paddingTop:6}}><FCheck label={t('piHasBaseline')} checked={st.piHasBaseline} onChange={v=>set('piHasBaseline',v)}/></div>
            <FInput label={t('kmWidth')} note={t('kmWidthNote')} type="number" min="0" max="20" step=".5" value={st.kmWidth} onChange={v=>set('kmWidth',v)} placeholder="mm"/>
            <FSelect label={t('cementRet')} value={st.cementRetained} onChange={v=>set('cementRetained',v)} opts={[
              {v:'',l:'—'},{v:'screw',l:t('cementRetScrew')},{v:'cement',l:t('cementRetCement')},{v:'na',l:t('cementRetNA')}
            ]}/>
          </div>
        )}
      </Card>

      {(() => {
        const isPerio = (st.caseTypeOverride==='periodontitis' || st.caseTypeOverride==='auto');
        const hasInput = !isPerio || (st.calWorst!=='' || st.rblPercent!=='');
        return (
          <button onClick={onCompute} disabled={!hasInput} title={!hasInput?t('btnComputeDisabled'):''} style={{
            width:'100%',padding:'14px 0',
            background:hasInput?'#2DD4BF':'#1A3050',
            color:hasInput?'#060D14':'#7B8AA4',
            fontWeight:800,fontSize:'1rem',borderRadius:12,border:'none',
            cursor:hasInput?'pointer':'not-allowed',
            fontFamily:'Heebo,Arial,sans-serif',
            boxShadow:hasInput?'0 2px 12px rgba(45,212,191,.15)':'none',
            transition:'all .15s'
          }}>
            {hasInput?t('btnCompute'):t('btnComputeDisabled')}
          </button>
        );
      })()}
    </div>
  );
}

/* ─── IMAGING TAB (Phase 7B: offline ONNX inference path) ─────────────────────
   Accepts JPEG / PNG (panoramic, periapical, bitewing). Max 8MB. Image is held
   in React state only — never persisted, never sent over the network in
   offline mode. Canvas is rendered LTR regardless of UI language because X-ray
   anatomy is spatial (same rule as the periodontal chart and IDRA octagon).
   Analyze runs `runOnnxInference(canvas)` against a vendored model; if the
   runtime or model isn't on disk yet the UI falls back to a clear "model
   missing" state. A separate "Run demo" button injects mock values so the
   downstream wiring (Findings → Apply → engine → letter) can be exercised. */
const IMG_MAX_BYTES = 8 * 1024 * 1024;
const IMG_VALID_TYPES = ['image/jpeg', 'image/png'];

function formatBytes(n){
  if(n < 1024) return `${n} B`;
  if(n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/(1024*1024)).toFixed(2)} MB`;
}

const CONF_COLORS = {
  low:  { bg:'#2D1A0D', border:'#7F4F1D', fg:'#FCD9A5' },
  med:  { bg:'#1A2D2D', border:'#1D7F7F', fg:'#A5F0F0' },
  high: { bg:'#0D2D1A', border:'#1D7F4F', fg:'#A5FCD9' },
};

function ImagingTab({imagingFile, setImagingFile,
                     imagingMode, setImagingMode,
                     imagingResult, setImagingResult,
                     imagingApplied, setImagingApplied,
                     onApply, lang, t}){
  const inputRef = useRef(null);
  const canvasRef = useRef(null);
  const [error, setError] = useState('');
  const [analysisError, setAnalysisError] = useState('');
  const [analyzing, setAnalyzing] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  /* Per-image consent — always reset when the file changes, so consent never
     carries over from a previous image. Phase 7C requires it before any
     cloud analysis call. */
  const [cloudConsent, setCloudConsent] = useState(false);
  useEffect(() => { setCloudConsent(false); }, [imagingFile?.dataUrl]);

  /* Draw the loaded image onto the canvas, fitted to a max display width while
     preserving aspect. Re-runs whenever imagingFile changes. */
  useEffect(() => {
    if(!imagingFile || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.naturalWidth);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = imagingFile.dataUrl;
  }, [imagingFile]);

  const handleFile = (file) => {
    setError('');
    if(!file) return;
    if(!IMG_VALID_TYPES.includes(file.type)){
      setError(t('imgInvalidType'));
      return;
    }
    if(file.size > IMG_MAX_BYTES){
      setError(t('imgFileTooLarge'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      const probe = new Image();
      probe.onload = () => {
        setImagingFile({
          name: file.name,
          type: file.type,
          size: file.size,
          dataUrl,
          width: probe.naturalWidth,
          height: probe.naturalHeight,
        });
      };
      probe.src = dataUrl;
    };
    reader.readAsDataURL(file);
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer?.files?.[0];
    if(file) handleFile(file);
  };

  const onChange = (e) => {
    const file = e.target.files?.[0];
    if(file) handleFile(file);
    /* Allow re-selecting the same file by clearing the value */
    e.target.value = '';
  };

  const onRemove = () => {
    setImagingFile(null);
    setImagingResult(null);
    setImagingApplied(false);
    setError('');
    setAnalysisError('');
  };

  const onAnalyze = async () => {
    if(!canvasRef.current) return;
    setAnalysisError('');
    setAnalyzing(true);
    try {
      const result = imagingMode === 'cloud'
        ? await postToVisionAPI({canvas: canvasRef.current, lang})
        : await runOnnxInference(canvasRef.current);
      setImagingResult(result);
      setImagingApplied(false);
    } catch(e){
      const code = e && e.message;
      /* Offline error codes */
      if(code === 'RUNTIME_MISSING')      setAnalysisError(t('imgRuntimeMissing'));
      else if(code === 'MODEL_MISSING')   setAnalysisError(t('imgModelMissing'));
      /* Cloud error codes */
      else if(code === 'NOT_CONFIGURED')  setAnalysisError(t('imgCloudErrNotConfigured'));
      else if(code === 'TOO_LARGE')       setAnalysisError(t('imgCloudErrTooLarge'));
      else if(code === 'FORBIDDEN')       setAnalysisError(t('imgCloudErrForbidden'));
      else if(code === 'RATE_LIMITED')    setAnalysisError(t('imgCloudErrRateLimited'));
      else if(code === 'BAD_IMAGE')       setAnalysisError(t('imgCloudErrBadImage'));
      else if(code === 'UPSTREAM_ERROR' || code === 'UPSTREAM_UNREACHABLE')
                                          setAnalysisError(t('imgCloudErrUpstream'));
      else if(code === 'UNPARSEABLE')     setAnalysisError(t('imgCloudErrUnparseable'));
      else                                 setAnalysisError(t('imgAnalysisFailed'));
    } finally {
      setAnalyzing(false);
    }
  };

  const onRunDemo = () => {
    setAnalysisError('');
    setImagingResult(generateDemoImagingResult());
    setImagingApplied(false);
  };

  const onClearFindings = () => {
    setImagingResult(null);
    setImagingApplied(false);
    setAnalysisError('');
  };

  const onApplyClick = () => {
    if(!imagingResult) return;
    onApply(imagingResult);
    setImagingApplied(true);
  };

  return (
    <div className="fade-in tab-content" style={{padding:'20px 16px',maxWidth:1100,margin:'0 auto'}}>
      <Card title={t('imgTitle')}>
        <div style={{color:'#94A3B8',fontSize:14,marginBottom:14,lineHeight:1.5}}>
          {t('imgSubtitle')}
        </div>

        {!imagingFile && (
          <div
            role="button"
            tabIndex={0}
            onClick={() => inputRef.current?.click()}
            onKeyDown={(e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inputRef.current?.click(); } }}
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDrop}
            style={{
              border: `2px dashed ${dragOver ? '#7DD3FC' : '#1A3050'}`,
              borderRadius: 12,
              padding: '48px 20px',
              textAlign: 'center',
              cursor: 'pointer',
              background: dragOver ? '#082038' : '#0A1828',
              transition: 'all 0.15s',
            }}
          >
            <div style={{fontSize:38,opacity:0.6,marginBottom:10}}>⊕</div>
            <div style={{color:'#E2E8F0',fontWeight:600,fontSize:16,marginBottom:6}}>
              {t('imgUpload')}
            </div>
            <div style={{color:'#7B8AA4',fontSize:13}}>
              {t('imgUploadHint')}
            </div>
          </div>
        )}

        <input
          ref={inputRef}
          type="file"
          accept="image/jpeg,image/png"
          onChange={onChange}
          style={{display:'none'}}
        />

        {error && (
          <div role="alert" style={{
            marginTop:14,padding:'10px 14px',borderRadius:8,
            background:'#2D0D0D',color:'#FCA5A5',fontSize:13,border:'1px solid #7F1D1D'
          }}>
            {error}
          </div>
        )}

        {imagingFile && (
          <div>
            {/* Canvas preview — LTR-locked because X-ray anatomy is spatial */}
            <div style={{
              direction:'ltr',
              background:'#000',
              border:'1px solid #1A3050',
              borderRadius:8,
              padding:8,
              display:'flex',
              justifyContent:'center',
              overflow:'auto',
            }}>
              <canvas ref={canvasRef} style={{maxWidth:'100%',display:'block'}}/>
            </div>

            {/* Metadata strip */}
            <div style={{
              marginTop:14,display:'flex',flexWrap:'wrap',gap:18,
              fontSize:13,color:'#94A3B8',
            }}>
              <div><span style={{color:'#7B8AA4'}}>{t('imgFileName')}:</span> <span style={{color:'#E2E8F0'}}>{imagingFile.name}</span></div>
              <div className="clinical-num"><span style={{color:'#7B8AA4'}}>{t('imgDimensions')}:</span> <span style={{color:'#E2E8F0'}}>{imagingFile.width}×{imagingFile.height}px</span></div>
              <div className="clinical-num"><span style={{color:'#7B8AA4'}}>{t('imgFileSize')}:</span> <span style={{color:'#E2E8F0'}}>{formatBytes(imagingFile.size)}</span></div>
            </div>

            {/* Actions */}
            <div style={{marginTop:16,display:'flex',gap:10,flexWrap:'wrap'}}>
              <button
                onClick={() => inputRef.current?.click()}
                style={{
                  padding:'8px 16px',borderRadius:8,border:'1px solid #1A3050',
                  background:'#0A1828',color:'#E2E8F0',cursor:'pointer',fontSize:14,
                }}
              >
                {t('imgChange')}
              </button>
              <button
                onClick={onRemove}
                style={{
                  padding:'8px 16px',borderRadius:8,border:'1px solid #7F1D1D',
                  background:'#1F0A0A',color:'#FCA5A5',cursor:'pointer',fontSize:14,
                }}
              >
                {t('imgRemove')}
              </button>
            </div>

            {/* Mode selector — Phase 7B ships offline only; cloud is wired in 7C */}
            <div style={{
              marginTop:20,padding:14,borderRadius:10,
              background:'#0A1828',border:'1px solid #1A3050',
            }}>
              <div style={{color:'#94A3B8',fontSize:13,marginBottom:10,fontWeight:600}}>
                {t('imgMode')}
              </div>
              {/* Segmented control — visual weight encodes the choice's gravity:
                  offline = teal (safe/local), cloud = red (PHI leaves device). */}
              <div role="radiogroup" aria-label={t('imgMode')} style={{
                display:'inline-flex',padding:3,borderRadius:10,
                background:'#06121F',border:'1px solid #1A3050',
              }}>
                <button
                  type="button"
                  role="radio"
                  aria-checked={imagingMode==='offline'}
                  onClick={()=>setImagingMode('offline')}
                  style={{
                    display:'flex',alignItems:'center',gap:8,
                    padding:'8px 14px',borderRadius:7,border:'none',cursor:'pointer',
                    fontSize:14,fontWeight:600,letterSpacing:0.2,
                    background: imagingMode==='offline' ? '#0D2D2D' : 'transparent',
                    color: imagingMode==='offline' ? '#5EEAD4' : '#94A3B8',
                    boxShadow: imagingMode==='offline' ? 'inset 0 0 0 1px #2DD4BF' : 'none',
                    transition:'all .15s ease',
                  }}
                >
